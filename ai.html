<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:transparent;color:#eef1f6;font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#bot{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;opacity:0;transition:opacity .4s}
#bot.in{opacity:1}
#state{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;padding:20px;text-align:center;color:#8a93a6}
.spin{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:#6a95ff;animation:sp .8s linear infinite}
@keyframes sp{to{rotate:360deg}}
.btn{height:36px;padding:0 18px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(255,255,255,.07);color:inherit;font:inherit;cursor:pointer;transition:.2s}
.btn:hover{background:rgba(106,149,255,.25);border-color:#6a95ff}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#out{position:fixed;top:10px;right:10px;z-index:2;width:30px;height:30px;border:0;border-radius:9px;background:rgba(7,10,20,.6);color:#c3cbdb;opacity:.55;cursor:pointer;transition:opacity .2s}
#out:hover,#out:focus-visible{opacity:1}
:focus-visible{outline:2px solid #6a95ff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="state" role="status"><div class="spin"></div><span>Loading the assistant…</span></div>
<button id="out" type="button" title="Open in a new tab" aria-label="Open the assistant in a new tab"><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></button>

<script>
/* The one thing this page shows */
const BOT_URL = "https://cdn.botpress.cloud/webchat/v5.0/shareable.html?configUrl=https://files.bpcontent.cloud/2026/11/06/05/20261106051852-0WPRKPDQ.json";
const state = document.getElementById("state");
const openTab = () => window.open(BOT_URL, "_blank", "noopener");
document.getElementById("out").onclick = openTab;

function start() {
  document.getElementById("bot")?.remove();
  state.hidden = false; state.replaceChildren(Object.assign(document.createElement("div"), { className: "spin" }), Object.assign(document.createElement("span"), { textContent: "Loading the assistant…" }));
  const frame = document.createElement("iframe");
  frame.id = "bot"; frame.title = "AI assistant"; frame.setAttribute("allow", "clipboard-write");
  frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals");   // can't navigate this page away
  const timer = setTimeout(() => {                 // friendly error if it never loads (offline or blocked by a network)
    const msg = document.createElement("span"), row = document.createElement("div"), retry = document.createElement("button"), open = document.createElement("button");
    msg.textContent = "Couldn't load the assistant. Check your connection, or your network may be blocking it.";
    row.className = "row"; retry.className = open.className = "btn"; retry.textContent = "Try again"; open.textContent = "Open in a new tab";
    retry.onclick = start; open.onclick = openTab; row.append(retry, open); state.replaceChildren(msg, row);
  }, 12000);
  frame.addEventListener("load", () => { clearTimeout(timer); state.hidden = true; frame.classList.add("in"); });
  frame.src = BOT_URL; document.body.prepend(frame);
}
start();
</script>
</body>
</html>
