<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent;color:#f2f4f8;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:70px 20px 20px;overflow-y:auto;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
:focus-visible{outline:2px solid #8aa4ff;outline-offset:2px}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
.glass{background:rgba(16,18,28,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14)}
h1{font-size:clamp(44px,9vw,84px);font-weight:800;letter-spacing:-.03em;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.search{display:flex;align-items:center;gap:10px;width:min(680px,100%);height:54px;padding:0 14px 0 20px;border-radius:28px;transition:.25s}
.search:focus-within{border-color:#8aa4ff;box-shadow:0 0 0 4px rgba(138,164,255,.18)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px}
kbd{padding:3px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.2);font-size:12px;color:#a3abbd}
.icons{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.circle{width:52px;height:52px;border-radius:50%;font-size:22px;transition:.2s}
.circle:hover,.tile:hover{transform:translateY(-4px) scale(1.07);background:rgba(255,255,255,.18)}
.pill{padding:6px 16px;border-radius:20px;font-size:13px;transition:.2s}
.pill:hover{background:rgba(255,255,255,.18)}
select.pill option{color:#111}
.corner{position:absolute;top:14px;display:flex;gap:10px}
.corner.l{left:14px;flex-direction:column;align-items:flex-start}
.corner.r{right:14px}
.dock{display:flex;gap:8px;padding:8px;border-radius:20px}
.tile{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);font-size:18px;transition:.2s}
.ic{font-size:18px;line-height:1}
.search .ic{font-size:17px}.circle .ic{font-size:21px}.pill .ic{font-size:13px;margin-right:4px}
@media(max-width:600px){.corner{position:static}.corner.l{flex-direction:row;align-items:center}body{justify-content:flex-start;padding-top:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="corner l"><div class="glass dock" id="dock"></div><button class="glass pill" id="b-trend"><span data-ic="flame"></span> Trending</button></div>
<div class="corner r"><button class="glass pill" id="b-discord">Discord</button><button class="glass pill" id="b-links">Get Links</button></div>
<h1>PeteZah</h1>
<form class="glass search" id="sf">
  <span aria-hidden="true" data-ic="search"></span>
  <input id="q" type="search" placeholder="Search the web or enter a URL" aria-label="Search" autocomplete="off">
  <kbd>Ctrl+K</kbd>
</form>
<div class="icons" id="icons"></div>
<select class="glass pill" id="eng" aria-label="Search engine">
  <option value="default">Default</option><option value="google">Google</option><option value="bing">Bing</option><option value="brave">Brave</option>
</select>
<script>
/* ===== CONFIG: edit links here ===== */
const CFG = { discord: "https://discord.gg/YOURINVITE", getLinks: "https://discord.gg/YOURINVITE", trending: "https://trends.google.com/trending" };
const DOCK = [["Instagram", "instagram", "https://www.instagram.com"], ["Spotify", "headphones", "https://open.spotify.com"], ["TikTok", "tiktok", "https://www.tiktok.com"]];
const ICONS = [["Games", "gamepad", { nav: "games" }], ["Apps", "grid", { url: "https://play.google.com" }], ["Music", "music", { url: "https://open.spotify.com" }],
  ["Movies", "film", { url: "https://www.themoviedb.org" }], ["TV", "tv", { url: "https://www.justwatch.com" }], ["Browser", "globe", { url: "https://duckduckgo.com" }], ["Chat", "chat", { nav: "chat" }]];

/* Font Awesome Free 6.5.2 icons (same set as the old site); loaded via the <link> in <head> */
const ICONS = {
  home:'fa-solid fa-house', gamepad:'fa-solid fa-gamepad', chat:'fa-solid fa-comments', settings:'fa-solid fa-gear',
  lock:'fa-solid fa-lock', alert:'fa-solid fa-triangle-exclamation', flame:'fa-solid fa-fire', plus:'fa-solid fa-plus',
  x:'fa-solid fa-xmark', back:'fa-solid fa-arrow-left', fwd:'fa-solid fa-arrow-right', reload:'fa-solid fa-rotate-right',
  search:'fa-solid fa-magnifying-glass', grid:'fa-solid fa-table-cells-large', music:'fa-solid fa-music', film:'fa-solid fa-film',
  tv:'fa-solid fa-tv', globe:'fa-solid fa-globe', instagram:'fa-brands fa-instagram', headphones:'fa-brands fa-spotify',
  tiktok:'fa-brands fa-tiktok'
};
const ico = n => '<i class="ic ' + (ICONS[n] || 'fa-solid fa-circle') + '" aria-hidden="true"></i>';
const fillIcons = () => document.querySelectorAll("[data-ic]").forEach(e => { e.innerHTML = ico(e.dataset.ic); });
const $ = id => document.getElementById(id);
const send = (sh, rest) => parent.postMessage(Object.assign({ sh }, rest), "*");
const act = a => a.nav ? send("nav", { to: a.nav }) : a.url ? send("open", { url: a.url, newTab: true }) : send("settings");
const mk = (cls, label, icon, a) => { const b = document.createElement("button"); b.className = cls; b.innerHTML = ico(icon); b.title = label; b.setAttribute("aria-label", label); b.onclick = () => act(a); return b; };

$("dock").append(...DOCK.map(([n, i, u]) => mk("tile", n, i, { url: u })), mk("tile", "Add shortcut", "plus", {}));
$("icons").append(...ICONS.map(([n, i, a]) => mk("glass circle", n, i, a)), mk("glass circle", "More (settings)", "plus", {}));
$("b-discord").onclick = () => act({ url: CFG.discord });
$("b-links").onclick = () => act({ url: CFG.getLinks });
$("b-trend").onclick = () => act({ url: CFG.trending });

$("sf").addEventListener("submit", e => { e.preventDefault(); const q = $("q").value.trim(); if (q) send("search", { q }); });
fillIcons();
try { $("eng").value = localStorage.getItem("sh0zy.engine") || "default"; } catch {}
$("eng").onchange = () => { try { localStorage.setItem("sh0zy.engine", $("eng").value); } catch {} };
addEventListener("message", e => { if (e.data && e.data.sh === "focus") { $("q").focus(); $("q").select(); } });
</script>
</body>
</html>
