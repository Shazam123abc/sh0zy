<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:transparent;color:#f2f4f8;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:16px;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
:focus-visible{outline:2px solid #8aa4ff;outline-offset:2px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.glass{background:rgba(16,18,28,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14)}
.wrap{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto;border-radius:18px;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
header strong{flex:1}#who{color:#a3abbd}
.btn{padding:6px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);transition:.2s}.btn:hover{background:rgba(138,164,255,.3)}
#log{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.07);overflow-wrap:anywhere;animation:in .25s ease}
.msg.me{align-self:flex-end;background:rgba(138,164,255,.22)}
.msg b{margin-right:8px}.msg time{font-size:11px;color:#a3abbd}
#hint{min-height:20px;padding:0 16px;font-size:12px;color:#ffb4a8}
form.c{display:flex;gap:8px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.12)}
input{height:38px;padding:0 14px;border-radius:19px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14)}
#m{flex:1;min-width:0}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);z-index:5}
.card{display:grid;gap:12px;width:min(90vw,340px);padding:22px;border-radius:18px;background:rgba(16,18,28,.95)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap glass">
  <header><strong>Global chat</strong><span id="who"></span><button class="btn" id="chg">Change name</button></header>
  <div id="log" role="log" aria-live="polite"></div>
  <p id="hint" role="status"></p>
  <form class="c" id="f"><input id="m" maxlength="300" placeholder="Send a message" aria-label="Message" autocomplete="off"><button class="btn">Send</button></form>
</div>
<div class="ov" id="nm" hidden>
  <form class="glass card" id="nf">
    <h2>Pick a username</h2>
    <input id="ni" maxlength="16" placeholder="2–16 letters, numbers, spaces" aria-label="Username" autocomplete="off">
    <button class="btn">Join chat</button>
  </form>
</div>

<!-- Firebase client SDK (compat build) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ==========================================================
   >>> PASTE YOUR FIREBASE CONFIG BELOW (Firebase console >
   >>> Project settings > Your apps > Web app > Config).
   >>> Use a Realtime Database; databaseURL is required.
   ========================================================== */
const FIREBASE_CONFIG = {
  apiKey: "PASTE_API_KEY",
  authDomain: "YOUR-PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR-PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR-PROJECT",
  appId: "PASTE_APP_ID"
};

const NAME_KEY = "sh0zy.name", MAX = 300, MIN_GAP = 1500, BURST = 6, WINDOW = 20000;
const BAD = /\b(f+u+c+k\w*|sh+i+t+\w*|bitch\w*|asshole\w*|cunt\w*|slut\w*|whore\w*|dick\w*|bastard\w*)\b/gi; // extend as needed
const clean = s => s.replace(BAD, m => "*".repeat(m.length));
const $ = id => document.getElementById(id);
const ls = { get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let name = ls.get(NAME_KEY), ref = null, hintT;

const hint = t => { $("hint").textContent = t; clearTimeout(hintT); hintT = setTimeout(() => { $("hint").textContent = ""; }, 3000); };
function setName(n) { name = n; ls.set(NAME_KEY, n); $("who").textContent = "You: " + n; $("nm").hidden = true; $("m").focus(); }

// Render one message (textContent only, so user text can never inject HTML)
function add(m) {
  const log = $("log"), mine = m.name === name;
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const row = document.createElement("div"); row.className = "msg" + (mine ? " me" : "");
  const who = document.createElement("b"); who.textContent = clean(String(m.name || "anon")).slice(0, 16);
  const tm = document.createElement("time"); tm.textContent = new Date(m.ts || Date.now()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const tx = document.createElement("div"); tx.textContent = clean(String(m.text || "")).slice(0, MAX);
  row.append(who, tm, tx); log.append(row);
  while (log.children.length > 200) log.firstChild.remove();
  if (near || mine) log.scrollTop = log.scrollHeight;   // auto-scroll
}

// Spam control: minimum gap between messages + max burst per window
const sent = [];
function allowed() {
  const now = Date.now();
  while (sent.length && now - sent[0] > WINDOW) sent.shift();
  if ((sent.length && now - sent[sent.length - 1] < MIN_GAP) || sent.length >= BURST) return false;
  sent.push(now); return true;
}

function start() {
  if (FIREBASE_CONFIG.apiKey.startsWith("PASTE") || typeof firebase === "undefined") {
    $("hint").textContent = "Chat isn't set up yet: paste your Firebase config at the top of pages/chat.html.";
    $("m").disabled = true; return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    ref = firebase.database().ref("messages");
    ref.limitToLast(100).on("child_added", s => add(s.val() || {}), () => hint("Couldn't read messages. Check your database rules."));
  } catch { $("hint").textContent = "Firebase failed to start. Check your config."; $("m").disabled = true; }
}

$("f").addEventListener("submit", e => {
  e.preventDefault();
  const text = clean($("m").value.trim()).slice(0, MAX);
  if (!text || !ref) return;
  if (!name) { $("nm").hidden = false; return; }
  if (!allowed()) return hint("Slow down a little before sending again.");
  ref.push({ name, text, ts: firebase.database.ServerValue.TIMESTAMP }).catch(() => hint("Message failed to send."));
  $("m").value = "";
});
$("nf").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("ni").value.replace(/[^\w .-]/g, "").trim().slice(0, 16);
  if (v.length < 2 || clean(v) !== v) return $("ni").setCustomValidity("Choose another name (2–16 characters).") || $("ni").reportValidity();
  setName(v);
});
$("ni").addEventListener("input", () => $("ni").setCustomValidity(""));
$("chg").onclick = () => { $("ni").value = name; $("nm").hidden = false; $("ni").focus(); };

if (name) setName(name); else $("nm").hidden = false;
start();
</script>
</body>
</html>
