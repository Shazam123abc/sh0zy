<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sh0zy</title>
<link rel="icon" id="fav" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">

<style>
:root{--bar:rgba(6,9,16,.9);--line:rgba(255,255,255,.09);--txt:#eef1f6;--mut:#8a93a6;--acc:#8aa4ff}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{display:grid;grid-template-columns:56px minmax(0,1fr);font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);background:#05070d;overflow:hidden}
/* Background: blue-tinted dark overlay + image (--bg) + CSS night-city fallback */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(8,14,32,.42),rgba(3,6,14,.72)),var(--bg,none),radial-gradient(circle at 20% 88%,rgba(255,170,90,.22),transparent 26%),radial-gradient(circle at 75% 75%,rgba(80,140,255,.3),transparent 34%),linear-gradient(#0b1530,#121a36 60%,#05070d);background-size:cover;background-position:center}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.glass{background:var(--bar);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ic{font-size:14px;line-height:1}
/* Sidebar */
#side{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 12px;background:linear-gradient(90deg,rgba(2,4,9,.97),rgba(6,10,20,.8));border-right:1px solid var(--line)}
#side .sp{flex:1}
.sb{position:relative;width:38px;height:34px;border:0;border-radius:9px;background:none;color:#c3cbdb;transition:.18s}
.sb:hover,.sb.on{background:rgba(255,255,255,.1);color:#fff}
.sb.logo{width:30px;height:30px;margin-bottom:6px;background:linear-gradient(135deg,#6a95ff,#2f4fd6);color:#fff;font-weight:800;font-size:15px}
.sb::after{content:attr(data-tip);position:absolute;left:46px;top:50%;translate:0 -50%;padding:3px 9px;border-radius:7px;background:rgba(0,0,0,.85);font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:9}
.sb:hover::after,.sb:focus-visible::after{opacity:1}
/* Tabs (strip shows only with 2+ tabs) and toolbar */
main{display:flex;flex-direction:column;min-width:0;height:100vh}
#tabs{display:flex;gap:2px;padding:4px 8px 0;background:var(--bar);overflow-x:auto}
.tab{display:flex;align-items:center;min-width:90px;max-width:180px;height:28px;border-radius:8px 8px 0 0;color:var(--mut);font-size:12px;transition:.15s}
.tab.on{background:rgba(255,255,255,.08);color:var(--txt)}
.tab button{height:100%;padding:0 8px;border:0;background:none}
.tab .t{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x:hover{color:#fff}
#bar{display:flex;align-items:center;gap:4px;height:36px;padding:0 10px;background:var(--bar);border-bottom:1px solid var(--line)}
.ib{height:26px;min-width:26px;padding:0 7px;border:0;border-radius:7px;background:none;color:var(--mut);transition:.15s}
.ib:hover:not(:disabled){background:rgba(255,255,255,.1);color:#fff}
.ib:disabled{opacity:.3;cursor:default}
.ib .ic{font-size:13px}
#rf{font-size:11px}
.ub{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mut);transition:.15s}
.ub:focus-within{border-color:var(--acc)}
#url{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13px;font-weight:600;color:var(--txt)}
#url::placeholder{font-weight:400;color:var(--mut)}
/* Viewport (page transitions: fade + slide) */
#view{position:relative;flex:1;min-height:0}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
#frame.in{opacity:1;transform:none}
#msg{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:20px}
#warn{position:absolute;bottom:10px;left:50%;translate:-50% 0;display:flex;gap:10px;align-items:center;padding:4px 6px 4px 14px;border-radius:14px;font-size:12px;z-index:2;white-space:nowrap}
#msg .ib,#warn .ib{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt)}
/* Status bar */
#status{display:flex;justify-content:space-between;align-items:center;gap:12px;height:26px;padding:0 12px;font-size:10.5px;color:var(--mut);background:var(--bar);border-top:1px solid var(--line);white-space:nowrap;overflow:hidden}
#status div{display:flex;align-items:center;gap:14px}
#status a{color:inherit;text-decoration:none}#status a:hover{color:#fff}
#status .ic{font-size:11px;margin-right:5px}
/* Settings dialog */
dialog{margin:auto;width:min(92vw,380px);padding:20px;border-radius:14px;color:var(--txt);background:rgba(10,13,22,.96);border:1px solid var(--line)}
dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
dialog label{display:block;margin-top:10px;font-size:12px;color:var(--mut)}
dialog input{width:100%;height:32px;margin-top:4px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.4)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.row .ib{border:1px solid var(--line)}
@media(max-width:640px){body{grid-template-columns:44px minmax(0,1fr)}.sb{width:34px}#rf,.hide-s{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav id="side" class="glass" aria-label="Pages"></nav>
<main>
  <div id="tabs" role="tablist" aria-label="Tabs"></div>
  <form id="bar" autocomplete="off">
    <button type="button" class="ib" id="back" aria-label="Back" data-ic="back"></button>
    <button type="button" class="ib" id="fwd" aria-label="Forward" data-ic="fwd"></button>
    <button type="button" class="ib" id="rl" aria-label="Reload" data-ic="reload"></button>
    <label class="ub"><span data-ic="lock" aria-hidden="true"></span><input id="url" aria-label="Address bar and search" placeholder="Search or enter address (Ctrl+K)" spellcheck="false"></label>
    <button type="button" class="ib" id="rf" title="Re-download this page, bypassing the cache">Refresh page</button>
  </form>
  <div id="view">
    <!-- Sandbox per spec; pages are loaded via srcdoc, never innerHTML -->
    <iframe id="frame" title="Page content" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-fullscreen" allow="fullscreen; autoplay"></iframe>
    <div id="msg" hidden></div>
    <div id="warn" class="glass" hidden>Site not loading? <button type="button" class="ib" id="ext">Open in new window</button></div>
  </div>
  <footer id="status" class="glass">
    <div><span id="count">1 tab</span><a data-l="discord"><span data-ic="discord"></span>Discord</a><a data-l="tos" class="hide-s">ToS</a><a data-l="privacy" class="hide-s">Privacy</a><a data-l="dmca" class="hide-s">DMCA</a></div>
    <div><span class="hide-s"><span data-ic="flame"></span>Trending</span><span id="sec"></span><span id="clock"></span></div>
  </footer>
</main>

<dialog id="set">
  <form method="dialog" id="sf">
    <h2>Settings</h2>
    <label>Background image URL<input id="s-bg" type="url" placeholder="https://example.com/city.jpg"></label>
    <label>Tab title<input id="s-title" maxlength="40" placeholder="Sh0zy"></label>
    <label>Favicon (emoji or image URL)<input id="s-icon" maxlength="300" placeholder="Single emoji or https://…"></label>
    <div class="row">
      <button type="button" class="ib" id="s-reset">Reset</button>
      <button type="button" class="ib" id="s-cancel">Cancel</button>
      <button class="ib">Save</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
/* ===== CONFIG ===== */
const BASE = "https://cdn.jsdelivr.net/gh/Shazam123abc/sh0zy@main/"; // tip: pin to @<commit-or-tag> for instant updates
const DEFAULT_BG = BASE + "bg.jpg";       // upload your rain-city image to the repo as bg.jpg (or paste any URL here / in Settings)
const SCHEME = "petezah://";              // internal address prefix
const LINKS = { discord: "https://discord.gg/YOURINVITE", tos: "#", privacy: "#", dmca: "#" };
const ENGINES = { default: "https://duckduckgo.com/?q=", google: "https://www.google.com/search?q=", bing: "https://www.bing.com/search?q=", brave: "https://search.brave.com/search?q=" };
// Injected into every page so Ctrl+K/T/W work while focus is inside the iframe
const FWD = '<script>addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&"ktw".indexOf(e.key.toLowerCase())>-1){e.preventDefault();parent.postMessage({sh:"key",key:e.key.toLowerCase()},"*")}})<\/script>';

/* ===== ICONS ===== */
/* Font Awesome Free 6.5.2 icons (same set as the old site); loaded via the <link> in <head> */
const ICONS = {
  home:'fa-solid fa-house', games:'fa-solid fa-gamepad', gamepad:'fa-solid fa-gamepad', chat:'fa-regular fa-comment',
  settings:'fa-solid fa-gear', lock:'fa-solid fa-lock', shield:'fa-solid fa-shield-halved', alert:'fa-solid fa-triangle-exclamation',
  flame:'fa-solid fa-fire', plus:'fa-solid fa-plus', x:'fa-solid fa-xmark', back:'fa-solid fa-arrow-left', fwd:'fa-solid fa-arrow-right',
  reload:'fa-solid fa-rotate-right', search:'fa-solid fa-magnifying-glass', robot:'fa-solid fa-robot', music:'fa-solid fa-music',
  film:'fa-solid fa-film', desktop:'fa-solid fa-desktop', window:'fa-regular fa-window-maximize', globe:'fa-solid fa-globe',
  wrench:'fa-solid fa-wrench', user:'fa-regular fa-user', link:'fa-solid fa-link', down:'fa-solid fa-chevron-down',
  discord:'fa-brands fa-discord', instagram:'fa-brands fa-instagram', spotify:'fa-brands fa-spotify', tiktok:'fa-brands fa-tiktok'
};
const ico = n => '<i class="ic ' + (/^fa-/.test(n) ? n : ICONS[n] || 'fa-solid fa-circle') + '" aria-hidden="true"></i>';
const fillIcons = () => document.querySelectorAll("[data-ic]").forEach(e => { e.innerHTML = ico(e.dataset.ic); });

/* ===== HELPERS ===== */
const $ = id => document.getElementById(id);
const h = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
const ls = { get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const frame = $("frame"), msg = $("msg"), warn = $("warn");
let pages = [], tabs = [], active = 0, nextId = 1, seq = 0, timer;
const cache = new Map();                  // in-memory page cache: file -> html text

const slugOf = p => p.file.replace(/\.html$/, "");
const addr = s => SCHEME + (s === "home" ? "newtab" : s);
const pageBySlug = s => pages.find(p => slugOf(p) === (s === "newtab" ? "home" : s));
const cur = () => tabs[active];
const entry = () => cur().hist[cur().i];   // entry = {p:slug} (internal) or {u:url} (web)
const label = t => { const e = t.hist[t.i]; return e.u ? new URL(e.u).hostname : (pageBySlug(e.p)?.name || e.p); };

/* ===== LOADING (only ever fetches BASE + pages.json / BASE + pages/<file from pages.json>) ===== */
async function getPage(file, fresh) {
  if (!/^[\w-]+\.html$/.test(file)) throw new Error("bad file");
  if (!fresh && cache.has(file)) return cache.get(file);
  const r = await fetch(BASE + file, { cache: fresh ? "reload" : "default" });
  if (!r.ok) throw new Error(r.status);
  const t = await r.text(); cache.set(file, t); return t;
}
function showMsg(text, ...btns) { msg.replaceChildren(h("p", { textContent: text }), ...btns); msg.hidden = false; }
const retryBtn = fn => h("button", { className: "ib", textContent: "Retry", onclick: fn });

async function render(fresh = false) {
  const e = entry(), my = ++seq;
  clearTimeout(timer); frame.classList.remove("in"); msg.hidden = true; warn.hidden = !e.u;
  drawChrome();
  if (e.u) {                               // external site
    frame.removeAttribute("srcdoc"); frame.src = e.u;
    timer = setTimeout(() => showMsg("This site is taking too long or refuses to be embedded.", h("button", { className: "ib", textContent: "Open in new window", onclick: openExt })), 10000);
    return;
  }
  const p = pageBySlug(e.p); if (!p) return;
  showMsg("Loading…");
  try {
    const html = await getPage(p.file, fresh);
    if (my !== seq) return;                // a newer navigation superseded this one
    msg.hidden = true; frame.srcdoc = html + FWD;
  } catch {
    if (my === seq) showMsg("Couldn't load this page. Check your connection and the BASE path.", retryBtn(() => render(true)));
  }
}
frame.onload = () => { clearTimeout(timer); frame.classList.add("in"); };

/* ===== NAVIGATION ===== */
function go(e, newTab) {
  if (newTab || !tabs.length) { tabs.push({ id: nextId++, hist: [e], i: 0 }); active = tabs.length - 1; }
  else { const t = cur(); t.hist = t.hist.slice(0, t.i + 1); t.hist.push(e); t.i++; }
  render();
}
function openPage(slug, newTab) { const p = pageBySlug(slug); if (p) go({ p: slugOf(p) }, newTab); }
function openUrl(u, newTab) { try { const x = new URL(u); if (/^https?:$/.test(x.protocol)) go({ u: x.href }, newTab); } catch {} }
function openExt() { const e = entry(); if (e.u) window.open(e.u, "_blank", "noopener"); }
function closeTab(i) {
  tabs.splice(i, 1);
  if (!tabs.length) return go({ p: "home" }, true);
  if (i < active) active--; active = Math.min(active, tabs.length - 1); render();
}
function resolve(q) {                       // address-bar text -> navigation entry
  q = String(q).trim().slice(0, 500);
  const m = q.match(/^petezah:\/\/(\w+)/i), pg = m && pageBySlug(m[1].toLowerCase());
  if (pg) return { p: slugOf(pg) };
  if (/^https?:\/\/\S+$/i.test(q)) return { u: q };
  if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(q)) return { u: "https://" + q };
  return { u: (ENGINES[ls.get("sh0zy.engine", "default")] || ENGINES.default) + encodeURIComponent(q) };
}
function hotkey(k) {
  if (k === "t") go({ p: "home" }, true);
  else if (k === "w" && tabs.length) closeTab(active);
  else if (k === "k" && tabs.length) {
    if (entry().p === "home") frame.contentWindow.postMessage({ sh: "focus" }, "*");
    else { $("url").focus(); $("url").select(); }
  }
}

/* ===== CHROME (tabs, URL bar, status) ===== */
function drawChrome() {
  const e = entry(), t = cur();
  $("tabs").replaceChildren(...tabs.map((x, i) => {
    const d = h("div", { className: "tab" + (i === active ? " on" : ""), role: "tab" });
    d.setAttribute("aria-selected", i === active);
    d.append(h("button", { className: "t", textContent: label(x), onclick: () => { active = i; render(); } }),
             h("button", { className: "x", innerHTML: ico("x"), ariaLabel: "Close tab", onclick: () => closeTab(i) }));
    return d;
  }), h("button", { className: "ib", innerHTML: ico("plus"), ariaLabel: "New tab", onclick: () => hotkey("t") }));
  $("url").value = e.u || addr(e.p); $("tabs").hidden = tabs.length < 2;
  $("back").disabled = t.i === 0; $("fwd").disabled = t.i >= t.hist.length - 1;
  $("count").textContent = tabs.length + (tabs.length === 1 ? " tab" : " tabs");
  const ok = !e.u || e.u.startsWith("https:"); $("sec").innerHTML = ico(ok ? "shield" : "alert") + (ok ? "Secure" : "Not secure");
  document.querySelectorAll(".sb[data-slug]").forEach(b => b.classList.toggle("on", !e.u && b.dataset.slug === e.p));
}
function buildSidebar() {
  const mk = (icon, tip, fn) => { const b = h("button", { className: "sb", innerHTML: ico(icon), onclick: fn, ariaLabel: tip }); b.dataset.tip = tip; return b; };
  const logo = h("button", { className: "sb logo", textContent: "S", onclick: () => openPage("home"), ariaLabel: "Home" }); logo.dataset.tip = "Home";
  $("side").replaceChildren(logo, h("span", { className: "sp" }),
    ...pages.map(p => { const b = mk((ICONS[p.icon] || /^fa-/.test(p.icon || "")) ? p.icon : slugOf(p), p.name, () => openPage(slugOf(p))); b.dataset.slug = slugOf(p); return b; }),
    mk("plus", "New tab", () => hotkey("t")), mk("settings", "Settings", openSettings));
}

/* ===== SETTINGS ===== */
function applySettings() {
  const bg = ls.get("sh0zy.bg", DEFAULT_BG).replace(/[()"'\\\s]/g, c => "%" + c.charCodeAt(0).toString(16));
  document.documentElement.style.setProperty("--bg", /^https?:\/\//.test(bg) ? 'url("' + bg + '")' : "none");
  document.title = ls.get("sh0zy.title") || "Sh0zy";
  const f = ls.get("sh0zy.icon");
  $("fav").href = !f ? "data:," : /^https?:\/\//.test(f) ? f
    : "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">' + f.replace(/[<>&]/g, "") + "</text></svg>");
}
function openSettings() {
  $("s-bg").value = ls.get("sh0zy.bg", DEFAULT_BG); $("s-title").value = ls.get("sh0zy.title"); $("s-icon").value = ls.get("sh0zy.icon");
  $("set").showModal();
}
$("sf").addEventListener("submit", () => {
  ls.set("sh0zy.bg", $("s-bg").value.trim()); ls.set("sh0zy.title", $("s-title").value.trim()); ls.set("sh0zy.icon", $("s-icon").value.trim());
  applySettings();
});
$("s-cancel").onclick = () => $("set").close();
$("s-reset").onclick = () => { ["bg", "title", "icon"].forEach(k => ls.set("sh0zy." + k, "")); applySettings(); $("set").close(); };

/* ===== EVENTS ===== */
$("back").onclick = () => { cur().i--; render(); };
$("fwd").onclick = () => { cur().i++; render(); };
$("rl").onclick = () => render();
$("rf").onclick = () => render(true);       // bypasses the in-memory + browser cache
$("ext").onclick = openExt;
$("bar").addEventListener("submit", ev => {
  ev.preventDefault(); const v = $("url").value.trim(); if (!v) return;
  const e = resolve(v); e.p ? openPage(e.p) : openUrl(e.u);
});
addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && "ktw".includes(e.key.toLowerCase())) { e.preventDefault(); hotkey(e.key.toLowerCase()); } });
// Messages from pages (only trusted while an internal page is showing)
addEventListener("message", e => {
  if (e.source !== frame.contentWindow || !tabs.length || entry().u) return;
  const d = e.data || {};
  if (d.sh === "key") hotkey(d.key);
  else if (d.sh === "nav") openPage(String(d.to), false);
  else if (d.sh === "open") openUrl(String(d.url), !!d.newTab);
  else if (d.sh === "search") { const r = resolve(d.q); if (r.u) openUrl(r.u, !!d.newTab); }
  else if (d.sh === "settings") openSettings();
});

/* ===== INIT ===== */
async function init() {
  try {
    const r = await fetch(BASE + "pages.json"); if (!r.ok) throw 0;
    pages = (await r.json()).filter(p => p && /^[\w-]+\.html$/.test(p.file)); if (!pages.length) throw 0;
  } catch { return showMsg("Couldn't load pages.json. Check BASE and that the repo is public.", retryBtn(init)); }
  buildSidebar(); go({ p: pageBySlug("home") ? "home" : slugOf(pages[0]) }, true);
}
document.querySelectorAll("[data-l]").forEach(a => { a.href = LINKS[a.dataset.l]; a.rel = "noopener"; if (LINKS[a.dataset.l] !== "#") a.target = "_blank"; });
const tick = () => { $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }; tick(); setInterval(tick, 1000);
fillIcons(); applySettings(); init();
</script>
</body>
</html>
