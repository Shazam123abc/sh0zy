<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIFT</title>
<link rel="icon" id="fav" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
<style>
:root{--txt:#eef1f6;--mut:#8a93a6;--line:rgba(255,255,255,.12);--acc:#6a95ff;--panel:#0b0c10;--bar:#17181d}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#07080c;color:var(--txt);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{font-size:14px;line-height:1}
.ib{height:34px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.07);transition:.15s;font-weight:500}.ib:hover:not(:disabled){background:rgba(106,149,255,.25);border-color:var(--acc)}.ib:disabled{opacity:.4;cursor:default}
.ib.primary{background:linear-gradient(135deg,var(--acc),#a78bfa);border:0;color:#fff}
.spin{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--acc);animation:sp .8s linear infinite}@keyframes sp{to{rotate:360deg}}

/* WALLPAPER */
#wall{position:fixed;inset:0;background:#07080c center/cover no-repeat}
#wall::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.1) 40%,rgba(0,0,0,.4))}

/* TOP BAR */
#top{position:fixed;top:0;left:0;right:0;z-index:5;height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
#top button{width:28px;height:28px;border:0;border-radius:8px;background:none;color:#e6e9f0}#top button:hover{background:rgba(255,255,255,.14)}
#clock{font-weight:600;letter-spacing:.03em}

/* DAY / DATE DISPLAY */
#day{position:fixed;top:56px;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 24px rgba(0,0,0,.6)}
#day b{display:block;padding-left:.42em;font-size:clamp(26px,4.4vw,54px);font-weight:300;letter-spacing:.42em;color:rgba(255,255,255,.9)}
#day span{display:block;margin-top:4px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6)}

/* TRANSPARENT BLACK DOCK WITH WHITE OUTLINE & NO ICON BACKGROUNDS */
#dock{position:fixed;left:50%;bottom:14px;translate:-50% 0;z-index:6;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:24px;background:rgba(0, 0, 0, 0.65);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255, 255, 255, 0.3);box-shadow:0 20px 50px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.25)}
.dk{position:relative;width:46px;height:46px;padding:0;border:0;background:none;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.dk .ti{width:100%;height:100%;display:grid;place-items:center;border-radius:14px;color:#fff;background:none;border:0;box-shadow:none;transition:.15s}
.dk:hover .ti{background:rgba(255,255,255,.1);border-radius:12px}
.dk .ic{font-size:22px}
.dk:hover,.dk:focus-visible{transform:translateY(-8px) scale(1.15)}
.dk::before{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;translate:-50% 0;padding:4px 9px;border-radius:7px;background:rgba(0,0,0,.9);font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s}
.dk:hover::before,.dk:focus-visible::before{opacity:1}
.dk::after{content:"";position:absolute;bottom:-6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff;opacity:0}
.dk.open::after{opacity:.6}.dk.act::after{opacity:1;box-shadow:0 0 6px #fff}
.sep{align-self:stretch;width:1px;margin:4px 4px;background:rgba(255,255,255,.2)}

/* WINDOWS */
#desk{position:fixed;inset:0;z-index:4;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:360px;min-height:260px;overflow:hidden;border-radius:14px;background:var(--panel);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 70px rgba(0,0,0,.65);animation:pop .22s cubic-bezier(.2,.8,.2,1);transition:box-shadow .2s,opacity .2s,transform .2s}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}}
.win.focus{box-shadow:0 30px 90px rgba(0,0,0,.85),0 0 0 1px rgba(138,164,255,.35)}
.win.min{opacity:0;transform:scale(.85) translateY(40px);pointer-events:none;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s .2s}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border:0}
.tb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:40px;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none}
.tt{display:flex;align-items:center;gap:8px;font-weight:600;color:#dfe3ec}.tt .ic{font-size:12px;color:var(--mut)}
.wb{display:flex;justify-content:flex-end;gap:8px}
.wb button{width:13px;height:13px;padding:0;border:0;border-radius:50%;background:#44464f;transition:background .15s}
.wb .b-m:hover{background:#febc2e}.wb .b-x:hover{background:#28c840}.wb .b-c:hover{background:#ff5f57}
.wbody{position:relative;flex:1;min-height:0;background:#08090c}
.wbody iframe{display:block;width:100%;height:100%;border:0;background:transparent}
.ph{position:absolute;inset:0;z-index:1;display:grid;place-content:center;justify-items:center;gap:10px;padding:20px;text-align:center;color:var(--mut);background:#08090c}
.rs{position:absolute;right:0;bottom:0;z-index:2;width:18px;height:18px;cursor:nwse-resize;touch-action:none}
#desk.drag iframe{pointer-events:none}
.err{position:fixed;left:50%;top:50%;translate:-50% -50%;z-index:4;display:grid;justify-items:center;gap:10px;padding:18px 22px;border-radius:16px;background:rgba(20,21,26,.92);border:1px solid var(--line);text-align:center}

/* MENU */
#menu{position:fixed;z-index:20;min-width:240px;padding:6px;border-radius:12px;background:#15161b;border:1px solid var(--line);box-shadow:0 16px 50px rgba(0,0,0,.6)}
#menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:0;border-radius:8px;background:none;text-align:left}
#menu button:hover:not(:disabled),#menu button:focus-visible{background:rgba(138,164,255,.22)}#menu button:disabled{opacity:.4;cursor:default}
#menu hr{margin:5px 6px;border:0;border-top:1px solid var(--line)}#menu .ic{width:16px;text-align:center;color:var(--mut)}

/* SETTINGS WINDOW CUSTOM STYLES */
.settings-container{padding:24px;display:grid;gap:20px;max-width:560px;margin:0 auto}
.settings-section{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:16px}
.settings-section h3{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--txt);display:flex;align-items:center;gap:8px}
.settings-section label{display:block;margin-top:12px;font-size:12px;color:var(--mut)}
.settings-section label:first-of-type{margin-top:0}
.settings-section input,.settings-section select{width:100%;height:36px;margin-top:4px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--txt)}
.settings-row{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}

/* OTHER DIALOGS (Wallpaper, Admin, Doc, Gate) */
dialog{margin:auto;width:min(92vw,380px);padding:20px;border-radius:14px;color:var(--txt);background:rgba(10,13,22,.96);border:1px solid var(--line)}
dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
dialog label{display:block;margin-top:10px;font-size:12px;color:var(--mut)}
dialog input{width:100%;height:32px;margin-top:4px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.4)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
dialog .ib{border:1px solid var(--line)}
.acts{display:grid;gap:8px;margin-top:14px}.acts .ib{height:34px;text-align:left}
#adm-info div{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--line)}#adm-info span{color:var(--mut);text-align:right;overflow-wrap:anywhere}
#wp-msg,#pw-msg{min-height:18px;margin-top:8px;font-size:12px;color:#ffb4a8}
#doc{width:min(92vw,560px)}
#doc-b{max-height:55vh;margin-top:8px;padding-right:6px;overflow:auto}
#doc-b h3{margin:14px 0 4px;font-size:13px}
#doc-b p{color:#c3cbdb;font-size:13px;line-height:1.55}#doc-b small{color:var(--mut)}
.gp{margin-top:10px;color:#c3cbdb;font-size:13px;line-height:1.55}
.lk{padding:0;border:0;background:none;color:#8fb0ff;text-decoration:underline}
#g-ok{height:34px;padding:0 20px;border:0;background:linear-gradient(135deg,#6a95ff,#a78bfa);color:#fff;font-weight:600}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="wall" aria-hidden="true"></div>
<header id="top"><button type="button" id="menuBtn" aria-label="Menu" aria-haspopup="menu"><i class="ic fa-solid fa-bars"></i></button><span id="clock"></span></header>
<div id="day" aria-hidden="true"><b id="dayName"></b><span id="dateTxt"></span></div>
<main id="desk"></main>
<nav id="dock" aria-label="Apps"></nav>
<div id="menu" role="menu" hidden>
  <button role="menuitem" data-a="wall"><i class="ic fa-regular fa-image"></i>Change wallpaper</button>
  <button role="menuitem" data-a="settings"><i class="ic fa-solid fa-gear"></i>Settings</button>
  <hr>
  <button role="menuitem" data-doc="tos"><i class="ic fa-regular fa-file-lines"></i>Terms of Service</button>
  <button role="menuitem" data-doc="privacy"><i class="ic fa-regular fa-shield-halved"></i>Privacy Policy</button>
  <button role="menuitem" data-a="discord"><i class="ic fa-brands fa-discord"></i>Join our Discord</button>
  <hr>
  <button role="menuitem" data-a="dl-site"><i class="ic fa-solid fa-download"></i>Download site HTML</button>
  <button role="menuitem" data-a="dl-app"><i class="ic fa-solid fa-download"></i>Download this app's HTML</button>
</div>

<dialog id="wp">
  <h2>Wallpaper</h2>
  <label>Image link<input id="wp-url" type="url" placeholder="https://example.com/city.jpg"></label>
  <div class="acts"><button type="button" class="ib" id="wp-apply">Use this link</button>
    <button type="button" class="ib" id="wp-up"><span data-ic="upload"></span> Upload an image</button></div>
  <div class="acts"><button type="button" class="ib" id="wp-p1">Wallpaper 1</button><button type="button" class="ib" id="wp-p2">Wallpaper 2</button></div>
  <input id="wp-file" type="file" accept="image/*" hidden>
  <p id="wp-msg" role="status"></p>
  <div class="row"><button type="button" class="ib" id="wp-reset">Reset</button><button type="button" class="ib" id="wp-x">Close</button></div>
</dialog>

<dialog id="pw">
  <form id="pw-f" autocomplete="off">
    <h2>Admin</h2>
    <label>Password<input id="pw-in" type="password" autocomplete="off" required></label>
    <p id="pw-msg" role="alert"></p>
    <div class="row"><button type="button" class="ib" id="pw-x">Cancel</button><button class="ib">Unlock</button></div>
  </form>
</dialog>

<dialog id="adm">
  <h2>Admin panel</h2>
  <div id="adm-info"></div>
  <div class="acts">
    <button type="button" class="ib" id="a-cache"><span data-ic="reload"></span> Clear page cache &amp; reload</button>
    <button type="button" class="ib" id="a-site"><span data-ic="download"></span> Download site HTML</button>
    <button type="button" class="ib" id="a-page"><span data-ic="download"></span> Download this page's HTML</button>
    <button type="button" class="ib" id="a-wall"><span data-ic="image"></span> Change wallpaper</button>
    <button type="button" class="ib" id="a-reset"><span data-ic="alert"></span> Reset all saved data</button>
  </div>
  <div class="row"><button type="button" class="ib" id="adm-x">Close</button></div>
</dialog>

<dialog id="doc"><h2 id="doc-t"></h2><div id="doc-b"></div><div class="row"><button type="button" class="ib" id="doc-x">Close</button></div></dialog>

<dialog id="gate">
  <h2>Before you continue</h2>
  <p class="gp">SIFT is for personal time. It isn't affiliated with any school, and it may not be allowed on your school's devices or network. You are responsible for following your school's rules.</p>
  <p class="gp">By continuing you agree to the <button type="button" class="lk" id="g-tos">Terms of Service</button> and <button type="button" class="lk" id="g-priv">Privacy Policy</button>.</p>
  <div class="row"><button class="ib" id="g-ok">I agree</button></div>
</dialog>

<script>
"use strict";
/* ===== CONFIG ===== */
const BASE = "https://cdn.jsdelivr.net/gh/Shazam123abc/sh0zy@main/";
const LINKS = { discord: "https://discord.com/invite/2zZTRMZPa4" };
const FORCED_WALLPAPER = "https://wallpaperaccess.com/full/26292853.jpg";
const FWD = '<script>addEventListener("keydown",function(e){if(e.shiftKey&&e.altKey&&e.code==="KeyA"){e.preventDefault();parent.postMessage({sh:"key",key:"admin"},"*")}})<\/script>';
const ICONS = { gamepad:'fa-solid fa-gamepad', games:'fa-solid fa-gamepad', chat:'fa-regular fa-comment', robot:'fa-solid fa-robot', discord:'fa-brands fa-discord', settings:'fa-solid fa-gear',
  reload:'fa-solid fa-rotate-right', download:'fa-solid fa-download', upload:'fa-solid fa-upload', image:'fa-regular fa-image', alert:'fa-solid fa-triangle-exclamation' };
const ico = n => '<i class="ic ' + (/^fa-[\w -]+$/.test(n) ? n : ICONS[n] || 'fa-solid fa-window-maximize') + '" aria-hidden="true"></i>';
const $ = id => document.getElementById(id);
const h = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
const ls = { get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };

let pages = [], focused = null, zTop = 10;
const apps = new Map(), cache = new Map(), wins = new Map(), dockBtns = new Map();
const desk = $("desk"), menu = $("menu");
const slugOf = p => p.file.replace(/\.html$/, "");

async function getPage(file, fresh) {
  if (!/^[\w-]+\.html$/.test(file)) throw new Error("bad file");
  if (!fresh && cache.has(file)) return cache.get(file);
  const r = await fetch(BASE + file, { cache: fresh ? "reload" : "default" });
  if (!r.ok) throw new Error(r.status);
  const t = await r.text(); cache.set(file, t); return t;
}

function setWall() {
  const custom = ls.get("sh0zy.bg");
  const targetBg = custom || FORCED_WALLPAPER;
  $("wall").style.backgroundImage = 'url("' + targetBg + '")';
}

function applySettings() {
  document.title = ls.get("sh0zy.title") || "SIFT";
  const f = ls.get("sh0zy.icon");
  $("fav").href = !f ? "data:," : /^https?:\/\//.test(f) ? f : "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">' + f.replace(/[<>&]/g, "") + "</text></svg>");
  
  // Custom Accent Color
  const acc = ls.get("sh0zy.acc") || "#6a95ff";
  document.documentElement.style.setProperty("--acc", acc);

  // Show/Hide Date Widget
  const hideDate = ls.get("sh0zy.hidedate") === "1";
  $("day").style.display = hideDate ? "none" : "block";

  setWall();
}

/* ===== SETTINGS AS A WINDOW ===== */
function openSettings() {
  if (wins.has("settings-win")) {
    focusWin(wins.get("settings-win"));
    return;
  }
  const el = h("section", { className: "win" });
  el.setAttribute("aria-label", "Settings");
  el.innerHTML = '<div class="tb"><span></span><span class="tt"><i class="ic fa-solid fa-gear" aria-hidden="true"></i><b>Settings</b></span><div class="wb"><button type="button" class="b-m" aria-label="Minimize"></button><button type="button" class="b-x" aria-label="Maximize"></button><button type="button" class="b-c" aria-label="Close"></button></div></div><div class="wbody" style="overflow:auto;background:var(--panel);"></div><i class="rs"></i>';
  
  const W = Math.min(520, Math.round(innerWidth * 0.8)), H = Math.min(500, Math.round(innerHeight * 0.8));
  Object.assign(el.style, { width: W + "px", height: H + "px", left: Math.round((innerWidth - W) / 2) + "px", top: Math.round((innerHeight - H) / 2) + "px" });

  const body = el.querySelector(".wbody");
  body.innerHTML = `
    <div class="settings-container">
      <div class="settings-section">
        <h3><i class="fa-solid fa-globe"></i> General Branding</h3>
        <label>Tab Title</label>
        <input id="st-title" maxlength="40" value="${ls.get("sh0zy.title") || "SIFT"}" placeholder="SIFT">
        <label>Favicon (Emoji or Image URL)</label>
        <input id="st-icon" maxlength="300" value="${ls.get("sh0zy.icon")}" placeholder="🔥 or https://…">
      </div>
      <div class="settings-section">
        <h3><i class="fa-solid fa-palette"></i> Appearance & Theme</h3>
        <label>Accent Color</label>
        <select id="st-acc">
          <option value="#6a95ff" ${ls.get("sh0zy.acc")==="#6a95ff"?"selected":""}>Electric Blue</option>
          <option value="#a78bfa" ${ls.get("sh0zy.acc")==="#a78bfa"?"selected":""}>Neon Purple</option>
          <option value="#10b981" ${ls.get("sh0zy.acc")==="#10b981"?"selected":""}>Emerald Green</option>
          <option value="#ef4444" ${ls.get("sh0zy.acc")==="#ef4444"?"selected":""}>Crimson Red</option>
          <option value="#f59e0b" ${ls.get("sh0zy.acc")==="#f59e0b"?"selected":""}>Amber Gold</option>
        </select>
        <label>Date/Day Timer Display</label>
        <select id="st-timer">
          <option value="0" ${ls.get("sh0zy.hidedate")!=="1"?"selected":""}>Visible (Default)</option>
          <option value="1" ${ls.get("sh0zy.hidedate")==="1"?"selected":""}>Hidden</option>
        </select>
      </div>
      <div class="settings-section">
        <h3><i class="fa-regular fa-image"></i> Preset Wallpapers</h3>
        <label>Click a wallpaper button to apply it instantly:</label>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px;">
          <button type="button" class="wp-thumb-btn" data-url="https://images.unsplash.com/photo-1459278558918-f94278c0f022?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" style="height:70px;border-radius:8px;border:1px solid var(--line);background:url('https://images.unsplash.com/photo-1459278558918-f94278c0f022?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D') center/cover;cursor:pointer;" title="Wallpaper 1"></button>
          <button type="button" class="wp-thumb-btn" data-url="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTTEFTn8rD0IZ3MzcN8wbIvMZ2h8ZMh8WIAk7MPo1NGGcNmLNpNHfKmjhXv:https://www.pictorem.com/uploads/collection/R/RB8PBQ2RHF/900_Adriart_japan_uji_maountain_nature.jpg&s=10" style="height:70px;border-radius:8px;border:1px solid var(--line);background:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTTEFTn8rD0IZ3MzcN8wbIvMZ2h8ZMh8WIAk7MPo1NGGcNmLNpNHfKmjhXv:https://www.pictorem.com/uploads/collection/R/RB8PBQ2RHF/900_Adriart_japan_uji_maountain_nature.jpg&s=10') center/cover;cursor:pointer;" title="Wallpaper 2"></button>
          <button type="button" class="wp-thumb-btn" data-url="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYF7HmWLiONoCVHKcDOJIxn9Ce6iBz5RltyD1ZWOShpOIitFAgLXtg2NCQ:https://img.magnific.com/premium-photo/mountain-range-with-foggy-valley-pine-forest_78871-4352.jpg%3Fw%3D360&s=10" style="height:70px;border-radius:8px;border:1px solid var(--line);background:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYF7HmWLiONoCVHKcDOJIxn9Ce6iBz5RltyD1ZWOShpOIitFAgLXtg2NCQ:https://img.magnific.com/premium-photo/mountain-range-with-foggy-valley-pine-forest_78871-4352.jpg%3Fw%3D360&s=10') center/cover;cursor:pointer;" title="Wallpaper 3"></button>
          <button type="button" class="wp-thumb-btn" data-url="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2QDoHMIDLfMrGU1vV6vFWjsxSa5Ys9SvErpOJlgucKFCszF0N2DMNs9oT:https://images.unsplash.com/photo-1761232007540-27ce50cb29f1%3Ffm%3Djpg%26q%3D60%26w%3D3000%26auto%3Dformat%26fit%3Dcrop%26ixlib%3Drb-4.1.0%26ixid%3DNHwxMjA3fDA%253D&s=10" style="height:70px;border-radius:8px;border:1px solid var(--line);background:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2QDoHMIDLfMrGU1vV6vFWjsxSa5Ys9SvErpOJlgucKFCszF0N2DMNs9oT:https://images.unsplash.com/photo-1761232007540-27ce50cb29f1%3Ffm%3Djpg%26q%3D60%26w%3D3000%26auto%3Dformat%26fit%3Dcrop%26ixlib%3Drb-4.1.0&ixid%3DNHwxMjA3fDA%253D&s=10') center/cover;cursor:pointer;" title="Wallpaper 4"></button>
        </div>
      </div>

        <button type="button" class="ib" id="st-reset">Reset Defaults</button>
        <button type="button" class="ib primary" id="st-save">Save Changes</button>
      </div>
    </div>
  `;

  body.querySelectorAll(".wp-thumb-btn").forEach(btn => {
    btn.onclick = () => {
      setBg(btn.dataset.url);
    };
  });

  body.querySelector("#st-save").onclick = () => {
    ls.set("sh0zy.title", body.querySelector("#st-title").value.trim());
    ls.set("sh0zy.icon", body.querySelector("#st-icon").value.trim());

  };

  body.querySelector("#st-reset").onclick = () => {
    ["title", "icon", "acc", "hidedate"].forEach(k => ls.del("sh0zy." + k));
    applySettings();
    el.remove();
    wins.delete("settings-win");
    if (focused === wObj) focused = topWin();
    paintDock();
  };

  const tb = el.querySelector(".tb"), rs = el.querySelector(".rs");
  const wObj = { app: { key: "settings-win", name: "Settings" }, el, min: false };

  el.addEventListener("pointerdown", () => focusWin(wObj), true);
  tb.addEventListener("dblclick", e => { if (!e.target.closest("button")) toggleMax(wObj); });
  el.querySelector(".b-m").onclick = () => minimize(wObj); 
  el.querySelector(".b-x").onclick = () => toggleMax(wObj); 
  el.querySelector(".b-c").onclick = () => closeWin(wObj);

  const drag = (handle, start, move) => handle.addEventListener("pointerdown", e => {
    if (e.button || e.target.closest("button") || el.classList.contains("max")) return;
    const s = start(e); handle.setPointerCapture(e.pointerId); desk.classList.add("drag");
    const mv = ev => move(ev, s), up = () => { handle.removeEventListener("pointermove", mv); handle.removeEventListener("pointerup", up); desk.classList.remove("drag"); };
    handle.addEventListener("pointermove", mv); handle.addEventListener("pointerup", up);
  });
  drag(tb, e => ({ x: e.clientX, y: e.clientY, l: el.offsetLeft, t: el.offsetTop }), (e, s) => {
    el.style.left = Math.min(innerWidth - 80, Math.max(80 - el.offsetWidth, s.l + e.clientX - s.x)) + "px"; 
    el.style.top = Math.min(innerHeight - 60, Math.max(36, s.t + e.clientY - s.y)) + "px";
  });
  drag(rs, e => ({ x: e.clientX, y: e.clientY, w: el.offsetWidth, h: el.offsetHeight }), (e, s) => {
    el.style.width = Math.max(360, s.w + e.clientX - s.x) + "px"; 
    el.style.height = Math.max(260, s.h + e.clientY - s.y) + "px";
  });

  desk.append(el);
  wins.set("settings-win", wObj);
  focusWin(wObj);
}

function save(name, text) {
  const a = h("a", { href: URL.createObjectURL(new Blob([text], { type: "text/html" })), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function download(what) {
  if (what === "site") { const c = document.documentElement.cloneNode(true); ["desk", "dock"].forEach(i => c.querySelector("#" + i).replaceChildren()); return save("sift.html", "<!DOCTYPE html>\n" + c.outerHTML); }
  if (focused && focused.frame && cache.has(focused.app.file)) save(focused.app.file, cache.get(focused.app.file));
}

function setBg(v) {
  v ? ls.set("sh0zy.bg", v) : ls.del("sh0zy.bg");
  $("wp-msg").textContent = v && ls.get("sh0zy.bg") !== v ? "That image is too big to save. Try a smaller one." : "";
  applySettings();
}
$("wp-file").onchange = e => {
  const f = e.target.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const s = Math.min(1, 1920 / im.width), c = h("canvas", { width: Math.round(im.width * s), height: Math.round(im.height * s) });
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); setBg(c.toDataURL("image/jpeg", 0.82)); }; im.src = r.result; };
  r.readAsDataURL(f); e.target.value = "";
};
$("wp-up").onclick = () => $("wp-file").click();
$("wp-apply").onclick = () => { const u = $("wp-url").value.trim(); /^https?:\/\//.test(u) ? setBg(u) : ($("wp-msg").textContent = "Enter a link that starts with https://"); };
$("wp-reset").onclick = () => { setBg(""); $("wp-url").value = ""; };
$("wp-x").onclick = () => $("wp").close();

const ADMIN_HASH = "f27eee50f9d3bc3a9ba83177abf2fb229a380c9b110de7df1e15814ee316bc57";
let adminOK = false;
const sha = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, "0")).join("");
function askAdmin() { if (adminOK) return openAdmin(); $("pw-in").value = ""; $("pw-msg").textContent = ""; $("pw").showModal(); }
$("pw-f").addEventListener("submit", async e => {
  e.preventDefault();
  let ok = false; try { ok = await sha($("pw-in").value) === ADMIN_HASH; } catch {}
  if (ok) { adminOK = true; $("pw").close(); openAdmin(); } else { $("pw-msg").textContent = "Wrong password."; $("pw-in").select(); }
});
$("pw-x").onclick = () => $("pw").close();
function openAdmin() {
  const rows = [["Site", "SIFT"], ["Source", BASE], ["Pages", pages.map(p => p.name).join(", ") || "none"], ["Cached", [...cache.keys()].join(", ") || "none"], ["Open windows", wins.size]];
  $("adm-info").replaceChildren(...rows.map(([k, v]) => h("div", {}, h("b", { textContent: k }), h("span", { textContent: String(v) }))));
  $("adm").showModal();
}
$("a-cache").onclick = () => { cache.clear(); $("adm").close(); wins.forEach(w => { if(w.load) w.load(true); }); };
$("a-site").onclick = () => download("site");
$("a-page").onclick = () => download("page");
$("a-wall").onclick = () => { $("adm").close(); $("wp").showModal(); };
$("a-reset").onclick = () => { if (!confirm("Clear every saved SIFT setting (wallpaper, title, icon, chat name, favorites)?")) return;
  try { Object.keys(localStorage).filter(k => k.startsWith("sh0zy.")).forEach(k => localStorage.removeItem(k)); } catch {}
  applySettings(); $("adm").close(); };
$("adm-x").onclick = () => $("adm").close();

function openDoc(k) { $("doc-t").textContent = DOCS[k][0]; $("doc-b").innerHTML = DOCS[k][1]; $("doc").showModal(); $("doc-b").scrollTop = 0; }
document.querySelectorAll("[data-doc]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); openDoc(a.dataset.doc); }));
$("doc-x").onclick = () => $("doc").close();
$("g-tos").onclick = () => openDoc("tos"); $("g-priv").onclick = () => openDoc("privacy");
$("gate").addEventListener("cancel", e => e.preventDefault());
$("g-ok").onclick = () => { ls.set("sh0zy.agreed", "1"); $("gate").close(); };
if (!ls.get("sh0zy.agreed")) $("gate").showModal();

$("wp-p1").onclick = () => setBg(FORCED_WALLPAPER);

const topWin = () => [...wins.values()].filter(x => !x.min).sort((a, b) => a.el.style.zIndex - b.el.style.zIndex).pop() || null;
function paintDock() { dockBtns.forEach((b, k) => { b.classList.toggle("open", wins.has(k)); b.classList.toggle("act", !!focused && focused.app.key === k); }); }
function focusWin(w) {
  if (w.min) { w.min = false; w.el.classList.remove("min"); }
  w.el.style.zIndex = ++zTop; focused = w; wins.forEach(x => x.el.classList.toggle("focus", x === w)); paintDock();
}
function minimize(w) { w.min = true; w.el.classList.add("min"); w.el.classList.remove("focus"); if (focused === w) focused = topWin(); if (focused) focused.el.classList.add("focus"); paintDock(); }
function closeWin(w) { w.el.remove(); wins.delete(w.app.key); if (focused === w) focused = topWin(); if (focused) focused.el.classList.add("focus"); paintDock(); }
const toggleMax = w => w.el.classList.toggle("max");

function createWin(app) {
  const el = h("section", { className: "win" }), n = wins.size;
  el.setAttribute("aria-label", app.name);
  el.innerHTML = '<div class="tb"><span></span><span class="tt"></span><div class="wb"><button type="button" class="b-m" aria-label="Minimize"></button><button type="button" class="b-x" aria-label="Maximize"></button><button type="button" class="b-c" aria-label="Close"></button></div></div><div class="wbody"><div class="ph"></div></div><i class="rs"></i>';
  el.querySelector(".tt").innerHTML = ico(app.icon) + "<b></b>"; el.querySelector(".tt b").textContent = app.name;
  const W = Math.min(980, Math.round(innerWidth * 0.74)), H = Math.min(640, Math.round(innerHeight * 0.72));
  Object.assign(el.style, { width: W + "px", height: H + "px", left: Math.max(8, Math.round((innerWidth - W) / 2) + n * 26 - 26) + "px", top: Math.max(44, 64 + n * 26) + "px" });
  const frame = h("iframe", { title: app.name });
  frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-fullscreen");
  frame.setAttribute("allow", "fullscreen; autoplay; pointer-lock; gamepad; clipboard-write"); frame.setAttribute("allowfullscreen", "");
  const ph = el.querySelector(".ph"), w = { app, el, frame, min: false };
  w.load = async fresh => {
    ph.hidden = false; ph.replaceChildren(h("div", { className: "spin" }), h("span", { textContent: "Loading " + app.name + "…" }));
    try { const html = await getPage(app.file, fresh); frame.srcdoc = html + FWD; }
    catch { ph.replaceChildren(h("span", { textContent: "Couldn't load " + app.name + ". Check your connection." }), h("button", { className: "ib", textContent: "Retry", onclick: () => w.load(true) })); }
  };
  frame.addEventListener("load", () => { if (frame.srcdoc) ph.hidden = true; });
  el.querySelector(".wbody").append(frame);
  const tb = el.querySelector(".tb"), rs = el.querySelector(".rs");
  el.addEventListener("pointerdown", () => focusWin(w), true);
  tb.addEventListener("dblclick", e => { if (!e.target.closest("button")) toggleMax(w); });
  el.querySelector(".b-m").onclick = () => minimize(w); el.querySelector(".b-x").onclick = () => toggleMax(w); el.querySelector(".b-c").onclick = () => closeWin(w);
  const drag = (handle, start, move) => handle.addEventListener("pointerdown", e => {
    if (e.button || e.target.closest("button") || el.classList.contains("max")) return;
    const s = start(e); handle.setPointerCapture(e.pointerId); desk.classList.add("drag");
    const mv = ev => move(ev, s), up = () => { handle.removeEventListener("pointermove", mv); handle.removeEventListener("pointerup", up); desk.classList.remove("drag"); };
    handle.addEventListener("pointermove", mv); handle.addEventListener("pointerup", up);
  });
  drag(tb, e => ({ x: e.clientX, y: e.clientY, l: el.offsetLeft, t: el.offsetTop }), (e, s) => {
    el.style.left = Math.min(innerWidth - 80, Math.max(80 - el.offsetWidth, s.l + e.clientX - s.x)) + "px"; el.style.top = Math.min(innerHeight - 60, Math.max(36, s.t + e.clientY - s.y)) + "px";
  });
  drag(rs, e => ({ x: e.clientX, y: e.clientY, w: el.offsetWidth, h: el.offsetHeight }), (e, s) => {
    el.style.width = Math.max(360, s.w + e.clientX - s.x) + "px"; 
    el.style.height = Math.max(260, s.h + e.clientY - s.y) + "px";
  });
  desk.append(el); wins.set(app.key, w); if (innerWidth < 700) el.classList.add("max");
  focusWin(w); w.load(); return w;
}
function openApp(key, toggle) {
  const app = apps.get(key); if (!app) return;
  const w = wins.get(key);
  if (!w) createWin(app); else if (w.min || focused !== w || !toggle) focusWin(w); else minimize(w);
}
addEventListener("blur", () => { menu.hidden = true; setTimeout(() => { wins.forEach(w => { if (w.frame && document.activeElement === w.frame) focusWin(w); }); }); });

const tint = k => ({ games: "#6a95ff", chat: "#a78bfa", ai: "#22d3ee" })[k] || "hsl(" + ([...k].reduce((a, c) => a + c.charCodeAt(0) * 17, 0) % 360) + " 70% 58%)";
function dockBtn(label, icon, color, fn, key) {
  const b = h("button", { type: "button", onclick: fn, className: "dk" }); b.setAttribute("aria-label", label); b.style.setProperty("--c", color); b.dataset.tip = label;
  b.innerHTML = '<span class="ti">' + ico(icon) + "</span>"; if (key) dockBtns.set(key, b); return b;
}
function buildDock() {
  $("dock").replaceChildren(
    ...[...apps.values()].filter(a => a.key !== "home" && a.key !== "index").map(a => dockBtn(a.name, a.icon, tint(a.key), () => openApp(a.key, true), a.key)), 
    h("i", { className: "sep" }),
    dockBtn("Discord", "discord", "#5865f2", () => window.open(LINKS.discord, "_blank", "noopener")), 
    dockBtn("Settings", "settings", "#64748b", openSettings)
  );
}

function tick() {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  $("dayName").textContent = d.toLocaleDateString([], { weekday: "long" }).toUpperCase(); 
  $("dateTxt").textContent = d.toLocaleDateString([], { month: "long", day: "numeric" });
}
tick(); setInterval(tick, 10000);

function showMenu(x, y) {
  menu.querySelector('[data-a="wall"]').onclick = () => { menu.hidden = true; $("wp").showModal(); };
  menu.querySelector('[data-a="settings"]').onclick = () => { menu.hidden = true; openSettings(); };
  menu.querySelector('[data-a="discord"]').onclick = () => { menu.hidden = true; window.open(LINKS.discord, "_blank", "noopener"); };
  menu.querySelector('[data-a="dl-site"]').onclick = () => { menu.hidden = true; download("site"); };
  menu.querySelector('[data-a="dl-app"]').onclick = () => { menu.hidden = true; download("page"); };
  menu.style.left = Math.min(innerWidth - menu.offsetWidth - 8, x) + "px";
  menu.style.top = Math.min(innerHeight - menu.offsetHeight - 8, y) + "px";
  menu.hidden = false;
}

$("menuBtn").onclick = e => {
  e.stopPropagation();
  const r = $("menuBtn").getBoundingClientRect();
  showMenu(r.left, r.bottom + 6);
};

window.onpointerdown = e => { if (!menu.contains(e.target)) menu.hidden = true; };

async function init() {
  try {
    const r = await fetch(BASE + "pages.json");
    if (r.ok) {
      pages = await r.json();
      pages.forEach(p => {
        const k = slugOf(p);
        if (k !== "home" && k !== "index") {
          apps.set(k, { key: k, name: p.name, icon: p.icon, file: p.file });
        }
      });
    }
  } catch {}
  if (apps.size === 0) {
    apps.set("games", { key: "games", name: "Games", icon: "gamepad", file: "games.html" });
    apps.set("chat", { key: "chat", name: "Chat", icon: "chat", file: "chat.html" });
    pages = [{ name: "Games", icon: "gamepad", file: "games.html" }, { name: "Chat", icon: "chat", file: "chat.html" }];
  }
  buildDock();
  applySettings();
}

window.addEventListener("message", e => {
  if (e.data && e.data.sh === "key" && e.data.key === "admin") askAdmin();
});

init();
</script>
