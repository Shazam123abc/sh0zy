<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIFT</title>
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
<style>
:root{
  --txt:#f4f6fb;
  --mut:rgba(235,240,250,.62);
  --line:rgba(255,255,255,.16);
  --line-bright:rgba(255,255,255,.28);
  --acc:#6a95ff;
  --acc2:#a78bfa;
  --glass:rgba(18,22,34,.38);
  --glass-heavy:rgba(15,19,31,.54);
  --glass-card:rgba(255,255,255,.075);
  --glass-card-hover:rgba(255,255,255,.13);
  --bar:rgba(25,30,44,.40);
  --blur:blur(30px) saturate(185%);
  --shadow:0 24px 64px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.24);
}

body[data-theme="obsidian"]{
  --glass:rgba(8,9,13,.68);
  --glass-heavy:rgba(5,6,9,.78);
  --glass-card:rgba(255,255,255,.055);
  --bar:rgba(10,11,16,.70);
}
body[data-theme="crystal"]{
  --txt:#111827;
  --mut:rgba(17,24,39,.65);
  --line:rgba(255,255,255,.45);
  --line-bright:rgba(255,255,255,.75);
  --glass:rgba(245,247,252,.48);
  --glass-heavy:rgba(250,252,255,.70);
  --glass-card:rgba(255,255,255,.38);
  --glass-card-hover:rgba(255,255,255,.58);
  --bar:rgba(255,255,255,.50);
  --shadow:0 24px 64px rgba(15,23,42,.16), inset 0 1px 0 rgba(255,255,255,.85);
}

*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#07080c;color:var(--txt);font:13px/1.45 'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{font-size:14px;line-height:1}

/* GLASS BUTTONS */
.ib{height:34px;padding:0 15px;border:1px solid var(--line);border-radius:11px;background:var(--glass-card);backdrop-filter:blur(12px);transition:all .18s cubic-bezier(.2,.8,.2,1);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.ib:hover:not(:disabled){background:var(--glass-card-hover);border-color:var(--line-bright);transform:translateY(-1px)}
.ib.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;box-shadow:0 6px 20px rgba(106,149,255,.35)}

.spin{width:28px;height:28px;border-radius:50%;border:2.5px solid rgba(255,255,255,.16);border-top-color:var(--acc);animation:sp .8s linear infinite}@keyframes sp{to{rotate:360deg}}

/* CLASSIC MAC OS "HELLO" BOOT ANIMATION (PACIFICO FONT, THIN SINGLE STROKE) */
#boot{
  position:fixed;inset:0;z-index:9999;
  background:#05060a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .85s cubic-bezier(.22,1,.36,1), transform .95s cubic-bezier(.22,1,.36,1), visibility 0s .95s;
}
#boot::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 45%, rgba(255,190,110,.12) 0%, rgba(56,115,215,.14) 45%, rgba(5,6,10,.96) 100%);
  filter:blur(32px);
  pointer-events:none;
}
#boot.done{opacity:0;transform:scale(1.05);pointer-events:none;visibility:hidden}
.hello-wrap{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
}
.hello-svg{
  width:min(420px, 74vw);height:auto;overflow:visible;
}
.hello-stroke{
  font-family:'Pacifico', cursive;
  font-size:104px;
  fill:none;
  stroke:#ffffff;
  stroke-width:1.2px;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:1200;
  stroke-dashoffset:1200;
  animation:helloDraw 2.2s cubic-bezier(.37,0,.2,1) .15s forwards;
  filter:drop-shadow(0 2px 14px rgba(255,255,255,.25));
}
@keyframes helloDraw{
  to{stroke-dashoffset:0}
}
.hello-start-btn{
  position:absolute;bottom:54px;z-index:2;
  background:none;border:0;color:rgba(255,255,255,.72);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  font-size:11.5px;font-weight:400;letter-spacing:.02em;
  cursor:pointer;opacity:0;transform:translateY(10px);
  animation:helloBtnIn .8s cubic-bezier(.22,1,.36,1) 1.6s forwards;
  transition:color .2s, transform .2s;
}
.hello-start-btn:hover{color:#fff;transform:translateY(-2px)}
@keyframes helloBtnIn{
  to{opacity:1;transform:translateY(0)}
}
.hello-start-ico{
  width:26px;height:26px;border-radius:50%;
  border:1px solid rgba(255,255,255,.32);
  display:grid;place-items:center;
  background:rgba(255,255,255,.05);
  font-size:9.5px;
  transition:background .2s, border-color .2s;
}
.hello-start-btn:hover .hello-start-ico{
  background:rgba(255,255,255,.14);
  border-color:rgba(255,255,255,.65);
}

/* WALLPAPER */
#wall{position:fixed;inset:0;background:#07080c center/cover no-repeat;transition:background-image .5s ease, transform 1.1s cubic-bezier(.22,1,.36,1);transform:scale(1.04)}
body.booted #wall{transform:scale(1)}
#wall::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 25%,rgba(0,0,0,.08),rgba(0,0,0,.38))}

/* AUTHENTIC MACOS TOP MENU BAR */
#top{
  position:fixed;top:0;left:0;right:0;z-index:26;height:30px;
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;
  background:rgba(16,19,28,.55);
  backdrop-filter:blur(32px) saturate(190%);
  -webkit-backdrop-filter:blur(32px) saturate(190%);
  border-bottom:1px solid rgba(255,255,255,.1);
  font-size:12.5px;
  transform:translateY(-100%);transition:transform .6s cubic-bezier(.22,1,.36,1) .15s;
}
body.booted #top{transform:translateY(0)}
.top-left,.top-right{display:flex;align-items:center;gap:2px}
#top button{
  height:22px;padding:0 9px;border:0;border-radius:5px;background:none;
  display:inline-flex;align-items:center;gap:6px;font-weight:500;color:rgba(255,255,255,.92);
  transition:background .14s, color .14s;
}
#top button:hover{background:rgba(255,255,255,.14);color:#fff}
.brand-diamond{padding:0 8px!important;font-size:14px}
.brand-diamond svg{width:14px;height:14px;display:block}
.top-active-app{font-weight:700!important;letter-spacing:-.01em}
.top-menu-item{font-weight:400!important;opacity:.9}
.top-icon-btn{width:28px;height:22px;padding:0!important;justify-content:center!important;font-size:12.5px}
.cc-toggle-icon{width:15px;height:14px;display:block}
#clock{font-weight:500;padding:0 4px 0 8px;color:rgba(255,255,255,.94);letter-spacing:-.01em;white-space:nowrap}

/* MISSION CONTROL WINDOW OVERVIEW EXPOSE */
#expose{
  position:fixed;inset:0;z-index:22;
  background:rgba(10,13,22,.48);
  backdrop-filter:blur(38px) saturate(185%);
  -webkit-backdrop-filter:blur(38px) saturate(185%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:56px 42px 96px;overflow-y:auto;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .28s cubic-bezier(.22,1,.36,1), visibility 0s .28s;
}
#expose.open{
  opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .28s cubic-bezier(.22,1,.36,1), visibility 0s 0s;
}
.ex-grid{
  width:min(1260px, 95vw);
  display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 260px));
  justify-content:center;gap:34px 26px;
}
.ex-item{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  cursor:pointer;position:relative;
  transition:transform .22s cubic-bezier(.2,.85,.25,1.2);
}
.ex-item:hover{transform:translateY(-4px) scale(1.03)}
.ex-win-box{
  width:100%;aspect-ratio:16/10.5;border-radius:11px;
  background:linear-gradient(145deg, rgba(32,37,50,.92), rgba(20,23,32,.96));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 22px 48px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.22);
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  transition:border-color .18s, box-shadow .18s;
}
.ex-item:hover .ex-win-box{
  border-color:rgba(106,149,255,.85);
  box-shadow:0 26px 56px rgba(0,0,0,.65), 0 0 0 2px rgba(106,149,255,.45);
}
.ex-win-chrome{
  height:20px;padding:0 8px;
  background:rgba(255,255,255,.06);
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:4px;
}
.ex-dot{width:6px;height:6px;border-radius:50%}
.ex-dot.r{background:#ff5f57}.ex-dot.y{background:#febc2e}.ex-dot.g{background:#28c840}
.ex-win-body{
  flex:1;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.06), transparent 70%);
}
.ex-win-ico{
  width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  font-size:21px;color:#fff;
  background:var(--ex-c, linear-gradient(160deg, #38bdf8, #0284c7));
  box-shadow:0 8px 20px rgba(0,0,0,.4);
}
.ex-close-btn{
  position:absolute;top:-8px;left:-8px;z-index:4;
  width:24px;height:24px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.35);
  background:rgba(28,32,42,.92);color:#fff;
  display:grid;place-items:center;font-size:11px;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
  opacity:0;transform:scale(.85);
  transition:opacity .16s, transform .16s, background .15s;
}
.ex-item:hover .ex-close-btn,.ex-close-btn:focus-visible{opacity:1;transform:scale(1)}
.ex-close-btn:hover{background:#ef4444;border-color:#fca5a5}
.ex-label{
  font-size:12.5px;font-weight:500;color:rgba(255,255,255,.94);
  text-shadow:0 2px 8px rgba(0,0,0,.75);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* MACOS SPOTLIGHT SEARCH OVERLAY */
#spotlight{
  position:fixed;inset:0;z-index:35;
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:16vh;
  background:rgba(0,0,0,.18);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .16s ease, visibility 0s .16s;
}
#spotlight.open{
  opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .16s ease, visibility 0s 0s;
}
.sp-box{
  width:min(640px, 92vw);
  border-radius:14px;
  background:rgba(36,38,48,.88);
  backdrop-filter:blur(44px) saturate(190%);
  -webkit-backdrop-filter:blur(44px) saturate(190%);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 32px 80px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.22);
  overflow:hidden;
  transform:scale(.97) translateY(-6px);
  transition:transform .18s cubic-bezier(.2,.8,.2,1);
}
#spotlight.open .sp-box{transform:scale(1) translateY(0)}
.sp-input-row{
  display:flex;align-items:center;gap:14px;
  height:56px;padding:0 18px;
}
.sp-input-row i{
  font-size:20px;color:rgba(255,255,255,.52);
}
.sp-input-row input{
  flex:1;border:0;background:none;outline:none;
  font-size:23px;font-weight:400;color:#fff;
  caret-color:#fff;
}
.sp-input-row input::placeholder{color:rgba(255,255,255,.35)}
.sp-results{
  border-top:1px solid rgba(255,255,255,.1);
  padding:6px;
  max-height:340px;overflow-y:auto;
}
.sp-results:empty{display:none}
.sp-row{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:7px 12px;border:0;border-radius:9px;
  background:none;text-align:left;color:#fff;
  transition:background .08s;
}
.sp-row.active{
  background:#ff5c93;
  box-shadow:0 4px 14px rgba(255,92,147,.32);
}
.sp-ico{
  width:28px;height:28px;border-radius:7px;flex-shrink:0;
  display:grid;place-items:center;font-size:14px;color:#fff;
  background:var(--sp-c, linear-gradient(160deg, #3b82f6, #1d4ed8));
  box-shadow:0 2px 6px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.45);
}
.sp-ico.safari{
  background:linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
  color:#2563eb;
}
.sp-name{
  flex:1;font-size:14px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sp-cat{
  font-size:12.5px;font-weight:500;
  color:rgba(255,255,255,.52);
}
.sp-row.active .sp-cat{color:rgba(255,255,255,.92)}

/* DAY / DATE DISPLAY */
#day{
  position:fixed;top:58px;left:0;right:0;text-align:center;pointer-events:none;
  text-shadow:0 4px 28px rgba(0,0,0,.45);
  opacity:0;transform:translateY(10px);transition:opacity .7s ease .25s, transform .7s ease .25s;
}
body.booted #day{opacity:1;transform:translateY(0)}
#day b{display:block;padding-left:.38em;font-size:clamp(28px,4.5vw,56px);font-weight:300;letter-spacing:.38em;color:rgba(255,255,255,.95)}
#day span{display:block;margin-top:4px;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.78)}

/* GLASS WIDGETS */
#widgets{
  position:fixed;top:52px;right:16px;z-index:3;width:308px;display:grid;gap:12px;
  max-height:calc(100% - 155px);overflow:auto;scrollbar-width:none;
  opacity:0;transform:translateX(16px);transition:opacity .7s ease .3s, transform .7s ease .3s;
}
body.booted #widgets{opacity:1;transform:translateX(0)}
.wg{padding:8px;border-radius:22px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow)}
.wg>header{display:flex;align-items:center;gap:10px;padding:8px 12px;font-weight:600;font-size:13px}
.wg>header button{margin-left:auto;width:26px;height:26px;border:0;border-radius:8px;background:none;color:var(--mut);transition:transform .25s,background .15s}
.wg>header button:hover{background:rgba(255,255,255,.12);color:var(--txt)}
.wg.shut>header button{transform:rotate(180deg)}.wg.shut .ul{display:none}
.u{margin:6px;padding:12px 14px;border-radius:15px;background:var(--glass-card);border:1px solid rgba(255,255,255,.08)}
.u small{color:var(--mut);font-size:11px;font-weight:500}.u b{display:block;margin-top:3px;font-size:14px;font-weight:600}.u p{margin-top:4px;color:var(--mut);font-size:12px}.u ul{margin:6px 0 0 18px;color:var(--mut);font-size:12px}

/* MACOS VIBRANT SQUIRCLE DOCK */
#dock{
  position:fixed;left:50%;bottom:14px;translate:-50% 0;z-index:16;
  display:flex;align-items:center;gap:11px;padding:10px 14px 12px;border-radius:24px;
  background:rgba(24,30,38,.52);
  backdrop-filter:blur(34px) saturate(190%);
  -webkit-backdrop-filter:blur(34px) saturate(190%);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 22px 55px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.25);
  transform:translateY(120%);transition:transform .65s cubic-bezier(.22,1,.36,1) .2s;
}
body.booted #dock{transform:translateY(0)}
.dk{
  position:relative;width:50px;height:50px;padding:0;border:0;background:none;
  transition:transform .22s cubic-bezier(.2,.85,.25,1.2);
}
.dk .ti{
  width:100%;height:100%;display:grid;place-items:center;
  border-radius:15px;color:#fff;
  background:var(--tile-bg, linear-gradient(160deg, #38bdf8, #0284c7));
  border:1.5px solid rgba(255,255,255,.35);
  box-shadow:0 6px 14px rgba(0,0,0,.32), inset 0 1.5px 1px rgba(255,255,255,.55);
  transition:filter .18s, box-shadow .18s;
}
.dk:hover .ti{
  filter:brightness(1.08);
  box-shadow:0 10px 22px rgba(0,0,0,.42), inset 0 1.5px 1px rgba(255,255,255,.75);
}
.dk .ic{font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.22))}
.dk:hover,.dk:focus-visible{transform:translateY(-8px) scale(1.13)}
.dk:active{transform:translateY(-2px) scale(1.03)}
.dk.start-dk .ti{background:linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);color:#3b82f6;border-color:rgba(255,255,255,.9)}
.dk.start-dk .ic{filter:none}
.dk::before{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 12px);left:50%;translate:-50% 0;
  padding:5px 10px;border-radius:8px;
  background:var(--glass-heavy);backdrop-filter:blur(16px);
  border:1px solid var(--line);color:var(--txt);
  font-size:11px;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;
  box-shadow:0 8px 20px rgba(0,0,0,.35);transition:opacity .15s, transform .15s;transform:translateY(4px);
}
.dk:hover::before,.dk:focus-visible::before{opacity:1;transform:translateY(0)}
.dk::after{
  content:"";position:absolute;bottom:-7px;left:50%;width:4.5px;height:4.5px;margin-left:-2.25px;
  border-radius:50%;background:rgba(255,255,255,.78);opacity:0;transition:.15s;
}
.dk.open::after{opacity:.75}
.dk.act::after{opacity:1;background:#60a5fa;box-shadow:0 0 6px #60a5fa}
.sep{align-self:stretch;width:1px;margin:4px 2px;background:rgba(255,255,255,.22)}

/* MACOS FULL-SCREEN LAUNCHPAD START MENU */
#startMenu{
  position:fixed;inset:0;z-index:14;
  background:rgba(12,15,24,.38);
  backdrop-filter:blur(44px) saturate(185%);
  -webkit-backdrop-filter:blur(44px) saturate(185%);
  display:flex;flex-direction:column;align-items:center;
  padding:54px 24px 108px;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .32s cubic-bezier(.22,1,.36,1), visibility 0s .32s, backdrop-filter .32s ease;
}
#startMenu.open{
  opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .32s cubic-bezier(.22,1,.36,1), visibility 0s 0s, backdrop-filter .32s ease;
}
.lp-inner{
  width:min(860px,92vw);display:flex;flex-direction:column;align-items:center;gap:42px;
  transform:scale(1.08);
  transition:transform .36s cubic-bezier(.22,1,.36,1);
}
#startMenu.open .lp-inner{transform:scale(1)}
.lp-search{
  display:flex;align-items:center;gap:8px;
  width:min(270px,80vw);height:32px;padding:0 12px;border-radius:8px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 4px 16px rgba(0,0,0,.18);
}
.lp-search input{flex:1;border:0;background:none;outline:none;font-size:13px;color:#fff;text-align:center}
.lp-search input:focus{text-align:left}
.lp-search input::placeholder{color:rgba(255,255,255,.62)}
.lp-grid{
  width:100%;max-height:calc(100vh - 210px);overflow-y:auto;scrollbar-width:none;
  display:grid;grid-template-columns:repeat(6,1fr);gap:34px 20px;
  justify-items:center;padding:8px;
}
.lp-item{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  background:none;border:0;padding:6px;border-radius:18px;width:110px;
  transition:transform .2s cubic-bezier(.2,.85,.25,1.2);
}
.lp-item:hover{transform:translateY(-4px) scale(1.06)}
.lp-ico{
  width:74px;height:74px;border-radius:19px;
  display:grid;place-items:center;color:#fff;font-size:32px;
  background:var(--c, linear-gradient(160deg, #38bdf8, #0284c7));
  border:1.5px solid rgba(255,255,255,.34);
  box-shadow:0 14px 30px rgba(0,0,0,.35), inset 0 1.5px 1px rgba(255,255,255,.55);
}
.lp-item span{
  font-size:12.5px;font-weight:500;color:rgba(255,255,255,.95);
  text-shadow:0 2px 8px rgba(0,0,0,.6);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* MACOS GLASS WINDOWS */
#desk{position:fixed;inset:0;z-index:6;pointer-events:none}
.win{
  position:absolute;pointer-events:auto;display:flex;flex-direction:column;
  min-width:360px;min-height:260px;overflow:hidden;border-radius:18px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.17) 0%, rgba(255,255,255,.055) 42%, rgba(255,255,255,.085) 100%),
    rgba(24,30,45,.27);
  -webkit-backdrop-filter: blur(42px) saturate(205%);
  backdrop-filter: blur(42px) saturate(205%);
  border: 1px solid rgba(255,255,255,.34);
  box-shadow:
    0 30px 90px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.48);
  animation:pop .24s cubic-bezier(.2,.8,.2,1);

"use strict";
const BASE = "https://cdn.jsdelivr.net/gh/Shazam123abc/sh0zy@main/";

  { name: "Aurora Mist", url: "https://images.unsplash.com/photo-1531366936337-7c912a4589a7?auto=format&fit=crop&w=2400&q=80" }
];
const TAB_PRESETS = [
  { name: "Canva", title: "Home - Canva", icon: "https://static.canva.com/static/images/favicon-1.ico" },

];
const UPDATES = [

];
const FWD = '<script>addEventListener("keydown",function(e){if(e.shiftKey&&e.altKey&&e.code==="KeyA"){e.preventDefault();parent.postMessage({sh:"key",key:"admin"},"*")}})<\/script>';
const ICONS = {
  gamepad:'fa-solid fa-gamepad', games:'fa-solid fa-gamepad', chat:'fa-regular fa-comment-dots',

  upload:'fa-solid fa-upload', image:'fa-regular fa-image'
};
const ico = n => '<i class="ic ' + (/^fa-[\w -]+$/.test(n) ? n : ICONS[n] || 'fa-solid fa-window-maximize') + '" aria-hidden="true"></i>';

const h = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };

};

let pages = [], focused = null, zTop = 10, toastTimer = null, spIndex = 0, spItems = [];

function notify(msg) {
  $("toastTxt").textContent = msg;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2600);
}

function launchAboutBlank() {
  const win = window.open("about:blank", "_blank");
  if (!win) { notify("Popup blocked! Allow popups for about:blank."); return; }
  const doc = win.document;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><title>${document.title || "My Drive - Google Drive"}</title><link rel="icon" href="${$("fav").href}"><style>html,body,iframe{margin:0;padding:0;width:100%;height:100%;border:0;overflow:hidden;background:#07080c}</style></head><body><iframe src="${location.href}" allowfullscreen></iframe></body></html>`);
  doc.close();
  notify("Opened in about:blank tab!");
}

function launchBlob() {
  try {
    const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const win = window.open(url, "_blank");
    if (!win) { notify("Popup blocked! Allow popups for Blob."); return; }
    notify("Opened in Blob URL!");
  } catch { notify("Could not create Blob session."); }
}

async function getPage(file, fresh) {
  if (!/^[\w-]+\.html$/.test(file)) throw new Error("bad file");
  if (!fresh && cache.has(file)) return cache.get(file);
  const r = await fetch(BASE + file, { cache: fresh ? "reload" : "default" });
  if (!r.ok) throw new Error(r.status);
  const t = await r.text(); cache.set(file, t); return t;
}

    );

    );

function renderSpotlight(rawQuery = "") {
  const q = rawQuery.trim();
  const ql = q.toLowerCase();
  if (!q) {
    spItems = [];
    $("spResults").replaceChildren();
    return;
  }

  const userApps = [...apps.values()].filter(a => a.key !== "home" && a.key !== "index");
  const catalog = [
    ...userApps.map((a, i) => ({
      name: a.name,
      cat: "Application",
      icon: a.icon,
      color: tileGradient(a.key, i),
      fn: () => { toggleSpotlight(false); openApp(a.key, false); }
    })),
    { name: "Settings", cat: "Application", icon: "settings", color: "linear-gradient(160deg, #94a3b8 0%, #64748b 100%)", fn: () => { toggleSpotlight(false); openSettings("preferences"); } },
    { name: "Wallpaper", cat: "System", icon: "image", color: "linear-gradient(160deg, #f43f5e 0%, #be123c 100%)", fn: () => { toggleSpotlight(false); $("wp").showModal(); } },
    { name: "Mission Control", cat: "System", icon: "fa-solid fa-window-restore", color: "linear-gradient(160deg, #38bdf8 0%, #0284c7 100%)", fn: () => { toggleSpotlight(false); toggleExpose(true); } },
    { name: "About Blank", cat: "System", icon: "fa-solid fa-ghost", color: "linear-gradient(160deg, #a78bfa 0%, #7c3aed 100%)", fn: () => { toggleSpotlight(false); launchAboutBlank(); } },
    { name: "Blob Mode", cat: "System", icon: "fa-solid fa-shield-halved", color: "linear-gradient(160deg, #34d399 0%, #059669 100%)", fn: () => { toggleSpotlight(false); launchBlob(); } },
    { name: "Discord", cat: "Application", icon: "discord", color: "linear-gradient(160deg, #6b76ff 0%, #5865f2 100%)", fn: () => { toggleSpotlight(false); window.open(LINKS.discord, "_blank", "noopener"); } }
  ];

  const matched = catalog
    .filter(item => item.name.toLowerCase().includes(ql))
    .sort((a, b) => {
      const aStarts = a.name.toLowerCase().startsWith(ql) ? 0 : 1;
      const bStarts = b.name.toLowerCase().startsWith(ql) ? 0 : 1;
      return aStarts - bStarts;
    });

  spItems = [
    ...matched,
    {
      name: `Search the web for “${q}”`,
      cat: "Safari",
      isSafari: true,
      fn: () => {
        toggleSpotlight(false);
        window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank", "noopener");
      }
    }
  ];

  if (spIndex >= spItems.length) spIndex = 0;

  $("spResults").replaceChildren(...spItems.map((item, idx) => {
    const row = h("button", {
      type: "button",
      className: "sp-row" + (idx === spIndex ? " active" : ""),
      onclick: item.fn,
      onmouseenter: () => {
        if (spIndex !== idx) {
          spIndex = idx;
          $("spResults").querySelectorAll(".sp-row").forEach((r, i) => r.classList.toggle("active", i === spIndex));
        }
      }
    });

    const icoEl = h("span", { className: "sp-ico" + (item.isSafari ? " safari" : "") });
    if (item.isSafari) {
      icoEl.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="10" fill="#2563eb"/><polygon points="15.5,8.5 13.2,13.2 8.5,15.5 10.8,10.8" fill="#ef4444"/><polygon points="15.5,8.5 13.2,13.2 10.8,10.8" fill="#ffffff"/></svg>`;
    } else {
      icoEl.style.setProperty("--sp-c", item.color);
      icoEl.innerHTML = ico(item.icon);
    }

    row.append(
      icoEl,
      h("span", { className: "sp-name", textContent: item.name }),
      h("span", { className: "sp-cat", textContent: item.cat })
    );
    return row;
  }));
}

$("spInput").addEventListener("input", e => {
  spIndex = 0;

});
$("spInput").addEventListener("keydown", e => {
  if (!spItems.length) return;
  if (e.key === "ArrowDown") {
    e.preventDefault();
    spIndex = (spIndex + 1) % spItems.length;
    $("spResults").querySelectorAll(".sp-row").forEach((r, i) => r.classList.toggle("active", i === spIndex));
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    spIndex = (spIndex - 1 + spItems.length) % spItems.length;
    $("spResults").querySelectorAll(".sp-row").forEach((r, i) => r.classList.toggle("active", i === spIndex));
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (spItems[spIndex]) spItems[spIndex].fn();
  }
});

/* ===== WINDOW MANAGER ===== */
const topWin = () => [...wins.values()].filter(x => !x.min).sort((a, b) => a.el.style.zIndex - b.el.style.zIndex).pop() || null;
function paintDock() {
  dockBtns.forEach((b, k) => {
    b.classList.toggle("open", wins.has(k));
    b.classList.toggle("act", !!focused && focused.app.key === k);
  });
  if ($("topActiveApp")) {
    $("topActiveApp").textContent = focused && !focused.min ? focused.app.name : "Finder";
  }
}
function focusWin(w) {
  if (w.min) { w.min = false; w.el.classList.remove("min"); }
  w.el.style.zIndex = ++zTop; focused = w; wins.forEach(x => x.el.classList.toggle("focus", x === w)); paintDock();
}
function minimize(w) { w.min = true; w.el.classList.add("min"); w.el.classList.remove("focus"); if (focused === w) focused = topWin(); if (focused) focused.el.classList.add("focus"); paintDock(); }
function closeWin(w) { w.el.remove(); wins.delete(w.app.key); if (focused === w) focused = topWin(); if (focused) focused.el.classList.add("focus"); paintDock(); }
const toggleMax = w => w.el.classList.toggle("max");

function createWin(app) {
  const el = h("section", { className: "win" }), n = wins.size;
  el.setAttribute("aria-label", app.name);
  el.innerHTML = `
    <div class="tb">
      <div class="wb">
        <button type="button" class="b-c" aria-label="Close"></button>
        <button type="button" class="b-m" aria-label="Minimize"></button>
        <button type="button" class="b-x" aria-label="Maximize"></button>
      </div>
      <span class="tt"></span>
      <span></span>
    </div>
    <div class="wbody"><div class="ph"></div></div>
    <i class="rs"></i>
  `;
  el.querySelector(".tt").innerHTML = ico(app.icon) + "<b>" + app.name + "</b>";
  const W = Math.min(980, Math.round(innerWidth * 0.74)), H = Math.min(640, Math.round(innerHeight * 0.72));
  Object.assign(el.style, { width: W + "px", height: H + "px", left: Math.max(8, Math.round((innerWidth - W) / 2) + n * 24 - 24) + "px", top: Math.max(42, 58 + n * 24) + "px" });
  const frame = h("iframe", { title: app.name });
  frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-fullscreen");
  frame.setAttribute("allow", "fullscreen; autoplay; pointer-lock; gamepad; clipboard-write");
  const ph = el.querySelector(".ph"), w = { app, el, frame, min: false };

  w.load = async fresh => {
    ph.hidden = false; ph.replaceChildren(h("div", { className: "spin" }), h("span", { textContent: "Loading " + app.name + "…" }));
    try { const html = await getPage(app.file, fresh); frame.srcdoc = html + FWD; }
    catch { ph.replaceChildren(h("span", { textContent: "Couldn't load " + app.name + "." }), h("button", { className: "ib primary", textContent: "Retry", onclick: () => w.load(true) })); }
  };
  frame.addEventListener("load", () => { if (frame.srcdoc) ph.hidden = true; });
  el.querySelector(".wbody").append(frame);

  const tb = el.querySelector(".tb"), rs = el.querySelector(".rs");
  el.addEventListener("pointerdown", () => focusWin(w), true);
  tb.addEventListener("dblclick", e => { if (!e.target.closest("button")) toggleMax(w); });
  el.querySelector(".b-m").onclick = () => minimize(w);
  el.querySelector(".b-x").onclick = () => toggleMax(w);
  el.querySelector(".b-c").onclick = () => closeWin(w);

  const drag = (handle, start, move) => handle.addEventListener("pointerdown", e => {
    if (e.button || e.target.closest("button") || el.classList.contains("max")) return;
    const s = start(e); handle.setPointerCapture(e.pointerId); desk.classList.add("drag");
    const mv = ev => move(ev, s), up = () => { handle.removeEventListener("pointermove", mv); handle.removeEventListener("pointerup", up); desk.classList.remove("drag"); };
    handle.addEventListener("pointermove", mv); handle.addEventListener("pointerup", up);
  });
  drag(tb, e => ({ x: e.clientX, y: e.clientY, l: el.offsetLeft, t: el.offsetTop }), (e, s) => {
    el.style.left = Math.min(innerWidth - 80, Math.max(80 - el.offsetWidth, s.l + e.clientX - s.x)) + "px";
    el.style.top = Math.min(innerHeight - 60, Math.max(32, s.t + e.clientY - s.y)) + "px";
  });
  drag(rs, e => ({ x: e.clientX, y: e.clientY, w: el.offsetWidth, h: el.offsetHeight }), (e, s) => {
    el.style.width = Math.max(360, s.w + e.clientX - s.x) + "px";
    el.style.height = Math.max(260, s.h + e.clientY - s.y) + "px";
  });

  desk.append(el); wins.set(app.key, w);
  focusWin(w); w.load(); return w;
}

function openApp(key, toggle) {
  const app = apps.get(key); if (!app) return;
  const w = wins.get(key);
  if (!w) createWin(app); else if (w.min || focused !== w || !toggle) focusWin(w); else minimize(w);
}

/* ===== DOCK ===== */
function dockBtn(label, icon, tileBg, fn, key, extraClass = "") {
  const b = h("button", { type: "button", onclick: fn, className: ("dk " + extraClass).trim() });
  b.setAttribute("aria-label", label);
  if (tileBg) b.style.setProperty("--tile-bg", tileBg);
  b.dataset.tip = label;
  b.innerHTML = '<span class="ti">' + ico(icon) + "</span>";
  if (key) dockBtns.set(key, b);
  return b;
}

function buildDock() {
  const userApps = [...apps.values()].filter(a => a.key !== "home" && a.key !== "index");
  $("dock").replaceChildren(
    dockBtn("Launchpad", "fa-solid fa-grip", null, e => { e.stopPropagation(); toggleStartMenu(); }, null, "start-dk"),
    h("i", { className: "sep" }),
    ...userApps.map((a, i) => dockBtn(a.name, a.icon, tileGradient(a.key, i), () => openApp(a.key, true), a.key, "app-" + a.key)),
    h("i", { className: "sep" }),
    dockBtn("Discord", "discord", null, () => window.open(LINKS.discord, "_blank", "noopener"), null, "app-discord"),
    dockBtn("Settings", "settings", null, () => openSettings("preferences"), "settings-win", "app-settings")
  );
}

/* ===== WIDGETS & CLOCK ===== */
$("updList").replaceChildren(...UPDATES.map(u => {
  const a = h("article", { className: "u" });
  a.append(h("small", { textContent: u.date + (u.tag ? " · " + u.tag : "") }), h("b", { textContent: u.title }), h("p", { textContent: u.text }));
  if (u.bullets) a.append(h("ul", {}, ...u.bullets.map(t => h("li", { textContent: t }))));
  return a;
}));
$("updBtn").onclick = () => $("upd").classList.toggle("shut");

function tick() {
  const d = new Date();
  const wk = d.toLocaleDateString([], { weekday: "short" });
  const mo = d.toLocaleDateString([], { month: "short" });
  const dy = d.getDate();
  const tm = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  $("clock").textContent = `${wk} ${mo} ${dy}  ${tm}`;
  $("dayName").textContent = d.toLocaleDateString([], { weekday: "long" }).toUpperCase();
  $("dateTxt").textContent = d.toLocaleDateString([], { month: "long", day: "numeric" });
}
tick(); setInterval(tick, 10000);

/* ===== TOP MENU BAR INTERACTIONS ===== */
function showMenu(x, y) {
  menu.querySelector('[data-a="start"]').onclick = () => { menu.hidden = true; toggleStartMenu(true); };
  menu.querySelector('[data-a="expose"]').onclick = () => { menu.hidden = true; toggleExpose(true); };
  menu.querySelector('[data-a="wall"]').onclick = () => { menu.hidden = true; $("wp").showModal(); };
  menu.querySelector('[data-a="settings"]').onclick = () => { menu.hidden = true; openSettings("preferences"); };
  menu.querySelector('[data-a="ab"]').onclick = () => { menu.hidden = true; launchAboutBlank(); };
  menu.querySelector('[data-a="blob"]').onclick = () => { menu.hidden = true; launchBlob(); };
  menu.querySelector('[data-a="discord"]').onclick = () => { menu.hidden = true; window.open(LINKS.discord, "_blank", "noopener"); };
  menu.querySelector('[data-a="dl-site"]').onclick = () => { menu.hidden = true; download("site"); };
  menu.querySelector('[data-a="dl-app"]').onclick = () => { menu.hidden = true; download("page"); };
  menu.style.left = Math.min(innerWidth - menu.offsetWidth - 8, x) + "px";
  menu.style.top = Math.min(innerHeight - menu.offsetHeight - 8, y) + "px";
  menu.hidden = false;
}

$("menuBtn").onclick = e => {
  e.stopPropagation();
  toggleStartMenu(false);
  toggleExpose(false);
  const r = $("menuBtn").getBoundingClientRect();
  showMenu(r.left, r.bottom + 6);
};
$("topActiveApp").onclick = e => { e.stopPropagation(); toggleStartMenu(true); };
$("topFileBtn").onclick = e => { e.stopPropagation(); toggleStartMenu(true); };
$("topEditBtn").onclick = () => openSettings("cloaking");
$("topViewBtn").onclick = () => openSettings("themes");
$("topWindowBtn").onclick = e => { e.stopPropagation(); toggleExpose(true); };
$("topHelpBtn").onclick = () => openDoc("tos");
$("topWifiBtn").onclick = () => notify("Connected to SIFT Network");
$("topSearchBtn").onclick = e => { e.stopPropagation(); toggleSpotlight(); };
$("topExposeBtn").onclick = e => { e.stopPropagation(); toggleExpose(); };

window.onpointerdown = e => {
  if (!menu.contains(e.target) && !$("menuBtn").contains(e.target)) menu.hidden = true;
};
window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    toggleSpotlight();
  }
  if (e.key === "Escape") {
    if (spotlight.classList.contains("open")) toggleSpotlight(false);
    if (startMenu.classList.contains("open")) toggleStartMenu(false);
    if (expose.classList.contains("open")) toggleExpose(false);
  }
});

/* ===== INIT & BOOT ANIMATION ===== */
async function init() {
  applySettings();
  try {
    const r = await fetch(BASE + "pages.json");
    if (r.ok) {
      pages = await r.json();
      pages.forEach(p => {
        let k = slugOf(p);
        if (k !== "home" && k !== "index") {
          let file = p.file;
          if (k === "games") file = "ofcgames.html";
          apps.set(k, { key: k, name: p.name, icon: p.icon, file: file });
        }
      });
    }
  } catch {}
  if (apps.size === 0) {
    apps.set("games", { key: "games", name: "Games", icon: "gamepad", file: "ofcgames.html" });
    apps.set("chat", { key: "chat", name: "Chat", icon: "chat", file: "chat.html" });
    apps.set("ai", { key: "ai", name: "AI", icon: "robot", file: "ai.html" });
    pages = [
      { name: "Games", icon: "gamepad", file: "ofcgames.html" },
      { name: "Chat", icon: "chat", file: "chat.html" },
      { name: "AI", icon: "robot", file: "ai.html" }
    ];
  } else {
    if (apps.has("games")) {
      apps.get("games").file = "ofcgames.html";
    }
  }
  buildDock();
  renderStartMenu();

  const finishBoot = () => {
    $("boot").classList.add("done");
    document.body.classList.add("booted");
  };
  $("helloBtn").onclick = finishBoot;
  setTimeout(finishBoot, 2900);

  if (window.self === window.top && location.protocol !== "blob:") {
    if (ls.get("sh0zy.autoab") === "1") launchAboutBlank();
    else if (ls.get("sh0zy.autoblob") === "1") launchBlob();
  }
}

init();
</script>
